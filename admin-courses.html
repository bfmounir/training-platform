<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>إدارة الدورات - المسؤول</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f4f6f8;
}

header {
    background: #1565c0;
    color: white;
    padding: 25px;
    text-align: center;
}

.container {
    max-width: 1100px;
    margin: 30px auto;
    padding: 20px;
}

.box {
    background: white;
    padding: 25px;
    border-radius: 12px;
    margin-bottom: 25px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
}

h2 {
    color: #1565c0;
}

label {
    display: block;
    margin-top: 15px;
    margin-bottom: 6px;
    font-weight: bold;
}

input,
textarea,
select {
    width: 100%;
    padding: 12px;
    border: 1px solid #ccc;
    border-radius: 8px;
    font-size: 15px;
}

textarea {
    min-height: 100px;
    resize: vertical;
}

button {
    border: none;
    border-radius: 7px;
    padding: 11px 18px;
    cursor: pointer;
    font-size: 15px;
    margin: 5px;
}

.primary {
    background: #1565c0;
    color: white;
}

.success {
    background: #2e7d32;
    color: white;
}

.warning {
    background: #ef6c00;
    color: white;
}

.danger {
    background: #c62828;
    color: white;
}

.secondary {
    background: #555;
    color: white;
}

.course {
    background: #fff;
    border: 1px solid #ddd;
    border-radius: 12px;
    padding: 20px;
    margin-bottom: 18px;
}

.course h3 {
    color: #1565c0;
    margin-top: 0;
}

.info {
    margin: 8px 0;
}

.message {
    padding: 12px;
    border-radius: 8px;
    margin-top: 15px;
    display: none;
}

.error {
    background: #ffebee;
    color: #c62828;
}

.ok {
    background: #e8f5e9;
    color: #2e7d32;
}

.loading {
    text-align: center;
    padding: 25px;
}

.actions {
    margin-top: 15px;
}

.hidden {
    display: none;
}

</style>

</head>


<body>


<header>

<h1>
📚 إدارة الدورات التكوينية
</h1>

<p>
لوحة تحكم المسؤول
</p>

</header>


<div class="container">


<!-- =========================
     التحقق
========================= -->

<div id="loadingBox"
     class="box loading">

⏳ جاري التحقق من صلاحيات المسؤول...

</div>


<div id="adminContent"
     class="hidden">


<!-- =========================
     نموذج إضافة / تعديل
========================= -->

<div class="box">

<h2 id="formTitle">
➕ إضافة دورة تكوينية
</h2>


<input
    type="hidden"
    id="courseId"
>


<label>
اسم الدورة
</label>

<input
    type="text"
    id="courseName"
    placeholder="مثال: الإسعافات الأولية"
>


<label>
وصف الدورة
</label>

<textarea
    id="courseDescription"
    placeholder="اكتب وصف الدورة..."
></textarea>


<label>
تاريخ الدورة
</label>

<input
    type="date"
    id="courseDate"
>


<label>
الفئة المستهدفة
</label>

<input
    type="text"
    id="targetAudience"
    placeholder="مثال: جميع العمال"
>


<button
    class="primary"
    onclick="saveCourse()"
>

💾 حفظ الدورة

</button>


<button
    id="cancelButton"
    class="secondary hidden"
    onclick="cancelEdit()"
>

إلغاء التعديل

</button>


<div
    id="formMessage"
    class="message"
></div>

</div>


<!-- =========================
     الدورات
========================= -->

<div class="box">

<h2>
📚 الدورات الموجودة
</h2>

<div id="coursesList">

<div class="loading">
⏳ جاري تحميل الدورات...
</div>

</div>

</div>


<button
    class="secondary"
    onclick="goBack()"
>

⬅️ العودة إلى لوحة المسؤول

</button>


</div>


</div>


<!-- Supabase -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="supabase-config.js"></script>


<script>


let currentUser = null;


/* =====================================================
   رسالة
===================================================== */

function showMessage(
    text,
    type = "ok"
) {

    const box =
        document.getElementById(
            "formMessage"
        );

    box.textContent = text;

    box.className =
        "message " + type;

    box.style.display =
        "block";

}


/* =====================================================
   المستخدم الحالي
===================================================== */

async function getCurrentUser() {

    const {
        data,
        error
    } =
    await supabaseClient.auth.getUser();

    if (
        error ||
        !data ||
        !data.user
    ) {

        return null;

    }

    return data.user;

}


/* =====================================================
   التحقق من المسؤول
===================================================== */

async function checkAdmin() {

    const loading =
        document.getElementById(
            "loadingBox"
        );

    const content =
        document.getElementById(
            "adminContent"
        );


    currentUser =
        await getCurrentUser();


    if (!currentUser) {

        loading.textContent =
            "يجب تسجيل الدخول أولًا.";

        setTimeout(
            function() {

                window.location.href =
                    "login.html";

            },
            1000
        );

        return;

    }


    const {
        data: roleData,
        error
    } =
    await supabaseClient
        .from("user_roles")
        .select("role")
        .eq(
            "user_id",
            currentUser.id
        )
        .maybeSingle();


    if (
        error ||
        !roleData ||
        roleData.role !== "admin"
    ) {

        loading.textContent =
            "⛔ هذه الصفحة مخصصة للمسؤول فقط.";

        setTimeout(
            function() {

                window.location.href =
                    "trainee.html";

            },
            1200
        );

        return;

    }


    loading.style.display =
        "none";

    content.classList.remove(
        "hidden"
    );


    await loadCourses();

}


/* =====================================================
   تحميل الدورات
===================================================== */

async function loadCourses() {

    const list =
        document.getElementById(
            "coursesList"
        );


    list.innerHTML =
        '<div class="loading">⏳ جاري تحميل الدورات...</div>';


    const {
        data,
        error
    } =
    await supabaseClient
        .from("courses")
        .select(
            "id, name, description, course_date, target_audience"
        )
        .order(
            "id",
            {
                ascending: false
            }
        );


    if (error) {

        console.error(error);

        list.innerHTML =
            '<div class="message error" style="display:block;">❌ تعذر تحميل الدورات.</div>';

        return;

    }


    if (
        !data ||
        data.length === 0
    ) {

        list.innerHTML =
            '<div class="loading">📚 لا توجد دورات حاليًا.</div>';

        return;

    }


    list.innerHTML = "";


    data.forEach(
        function(course) {

            const box =
                document.createElement(
                    "div"
                );


            box.className =
                "course";


            box.innerHTML = `

                <h3>
                    📚 ${escapeHtml(course.name)}
                </h3>

                <div class="info">
                    <strong>📝 الوصف:</strong>
                    ${escapeHtml(course.description || "لا يوجد وصف")}
                </div>

                <div class="info">
                    <strong>📅 التاريخ:</strong>
                    ${escapeHtml(course.course_date || "غير محدد")}
                </div>

                <div class="info">
                    <strong>👥 الفئة:</strong>
                    ${escapeHtml(course.target_audience || "جميع العمال")}
                </div>

                <div class="actions">

                    <button
                        class="warning"
                        onclick='editCourse(${JSON.stringify(course)})'
                    >
                        ✏️ تعديل
                    </button>

                    <button
                        class="danger"
                        onclick="deleteCourse('${course.id}')"
                    >
                        🗑️ حذف
                    </button>

                    <button
                        class="success"
                        onclick="openLessons('${course.id}')"
                    >
                        📖 إدارة الدروس
                    </button>

                </div>

            `;


            list.appendChild(
                box
            );

        }
    );

}


/* =====================================================
   إضافة / تعديل دورة
===================================================== */

async function saveCourse() {

    const id =
        document.getElementById(
            "courseId"
        ).value;


    const name =
        document.getElementById(
            "courseName"
        ).value.trim();


    const description =
        document.getElementById(
            "courseDescription"
        ).value.trim();


    const courseDate =
        document.getElementById(
            "courseDate"
        ).value;


    const targetAudience =
        document.getElementById(
            "targetAudience"
        ).value.trim();


    if (!name) {

        showMessage(
            "يرجى إدخال اسم الدورة.",
            "error"
        );

        return;

    }


    const courseData = {

        name:
            name,

        description:
            description,

        course_date:
            courseDate || null,

        target_audience:
            targetAudience || null

    };


    let result;


    if (id) {

        result =
            await supabaseClient
                .from("courses")
                .update(
                    courseData
                )
                .eq(
                    "id",
                    id
                );

    }

    else {

        result =
            await supabaseClient
                .from("courses")
                .insert(
                    courseData
                );

    }


    if (result.error) {

        console.error(
            result.error
        );


        showMessage(
            "❌ حدث خطأ: " +
            result.error.message,
            "error"
        );

        return;

    }


    showMessage(
        id
            ? "تم تعديل الدورة بنجاح ✅"
            : "تمت إضافة الدورة بنجاح ✅",
        "ok"
    );


    clearForm();


    await loadCourses();

}


/* =====================================================
   تعديل
===================================================== */

function editCourse(course) {

    document.getElementById(
        "courseId"
    ).value =
        course.id;


    document.getElementById(
        "courseName"
    ).value =
        course.name || "";


    document.getElementById(
        "courseDescription"
    ).value =
        course.description || "";


    document.getElementById(
        "courseDate"
    ).value =
        course.course_date || "";


    document.getElementById(
        "targetAudience"
    ).value =
        course.target_audience || "";


    document.getElementById(
        "formTitle"
    ).textContent =
        "✏️ تعديل الدورة";


    document.getElementById(
        "cancelButton"
    ).classList.remove(
        "hidden"
    );


    window.scrollTo(
        {
            top: 0,
            behavior: "smooth"
        }
    );

}


/* =====================================================
   إلغاء التعديل
===================================================== */

function cancelEdit() {

    clearForm();

}


/* =====================================================
   تنظيف النموذج
===================================================== */

function clearForm() {

    document.getElementById(
        "courseId"
    ).value = "";


    document.getElementById(
        "courseName"
    ).value = "";


    document.getElementById(
        "courseDescription"
    ).value = "";


    document.getElementById(
        "courseDate"
    ).value = "";


    document.getElementById(
        "targetAudience"
    ).value = "";


    document.getElementById(
        "formTitle"
    ).textContent =
        "➕ إضافة دورة تكوينية";


    document.getElementById(
        "cancelButton"
    ).classList.add(
        "hidden"
    );

}


/* =====================================================
   حذف دورة
===================================================== */

async function deleteCourse(
    courseId
) {

    const confirmed =
        confirm(
            "هل أنت متأكد من حذف هذه الدورة؟"
        );


    if (!confirmed) {

        return;

    }


    const {
        error
    } =
    await supabaseClient
        .from("courses")
        .delete()
        .eq(
            "id",
            courseId
        );


    if (error) {

        console.error(
            error
        );


        alert(
            "❌ تعذر حذف الدورة: " +
            error.message
        );

        return;

    }


    alert(
        "تم حذف الدورة بنجاح ✅"
    );


    await loadCourses();

}


/* =====================================================
   إدارة الدروس
===================================================== */

function openLessons(
    courseId
) {

    window.location.href =
        "admin-lessons.html?course_id=" +
        encodeURIComponent(
            courseId
        );

}


/* =====================================================
   العودة
===================================================== */

function goBack() {

    window.location.href =
        "admin.html";

}


/* =====================================================
   حماية عرض النص
===================================================== */

function escapeHtml(
    value
) {

    return String(value)
        .replace(
            /&/g,
            "&amp;"
        )
        .replace(
            /</g,
            "&lt;"
        )
        .replace(
            />/g,
            "&gt;"
        )
        .replace(
            /"/g,
            "&quot;"
        )
        .replace(
            /'/g,
            "&#039;"
        );

}


/* =====================================================
   تشغيل الصفحة
===================================================== */

checkAdmin();


</script>


</body>

</html>
