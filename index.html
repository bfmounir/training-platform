<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة التكوين المتواصل</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: #f4f6f8;
        }

        header {
            background: #1565c0;
            color: white;
            padding: 25px;
            text-align: center;
        }

        .container {
            max-width: 900px;
            margin: 40px auto;
            padding: 20px;
        }

        .card {
            background: white;
            padding: 25px;
            margin-bottom: 20px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        button {
            padding: 12px 25px;
            border: none;
            border-radius: 8px;
            background: #1565c0;
            color: white;
            cursor: pointer;
            font-size: 16px;
        }
    </style>
</head>

<body>

<header>
    <h1>منصة التكوين المتواصل</h1>
    <p>المؤسسة العمومية الاستشفائية</p>
</header>

<div class="container">

    <div class="card">
        <h2>مرحبًا بكم</h2>
        <p>
            هذه المنصة مخصصة للتكوين المتواصل للعمال والمتربصين.
        </p>

        <button onclick="alert('سيتم فتح الدورات التكوينية لاحقًا')">
            الدورات التكوينية
        </button>
    </div>

    <div class="card">
        <h2>الدروس</h2>
        <p>سيتم هنا عرض الدروس والمواد التكوينية.</p>
    </div>

    <div class="card">
        <h2>الشهادات</h2>
        <p>يمكن للمستفيدين تحميل شهاداتهم بعد إتمام التكوين.</p>
    </div>

</div>

</body>
</html>
