<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>الدروس التكوينية</title>

    <style>

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f8;
        }

        header {
            background: #1565c0;
            color: white;
            padding: 20px;
            text-align: center;
        }

        .container {
            max-width: 1000px;
            margin: 30px auto;
            padding: 20px;
        }

        .box {
            background: white;
            padding: 25px;
            border-radius: 12px;
            margin-bottom: 20px;
        }

        input,
        textarea,
        select {
            width: 100%;
            padding: 12px;
            margin: 8px 0 15px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 7px;
            font-size: 15px;
        }

        textarea {
            min-height: 150px;
            resize: vertical;
        }

        button {
            background: #1565c0;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 7px;
            cursor: pointer;
            font-size: 15px;
        }

        .message {
            margin-top: 15px;
            font-weight: bold;
        }

    </style>

</head>

<body>

<header>

    <h1>📖 الدروس التكوينية</h1>

    <p>إدارة الدروس والمواد التعليمية</p>

</header>


<div class="container">

    <div class="box">

        <h2>➕ إضافة درس جديد</h2>


        <label>عنوان الدرس</label>

        <input
            type="text"
            id="lessonTitle"
            placeholder="مثال: مبادئ الإسعافات الأولية"
        >


        <label>الدورة التكوينية</label>

        <select id="lessonCourse">

            <option value="">
                جاري تحميل الدورات...
            </option>

        </select>


        <label>ملف الدرس PDF</label>

        <input
            type="file"
            id="lessonFile"
            accept="application/pdf"
        >


        <label>محتوى الدرس</label>

        <textarea
            id="lessonContent"
            placeholder="اكتب محتوى الدرس هنا..."
        ></textarea>


        <button
            type="button"
            onclick="addLesson()"
        >
            ➕ إضافة الدرس
        </button>


        <div
            id="message"
            class="message"
        ></div>

    </div>

</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="supabase-config.js"></script>


<script>

async function loadCourses() {

    const select =
        document.getElementById("lessonCourse");


    const { data, error } =
        await supabaseClient
            .from("courses")
            .select("id, name")
            .order("name", {
                ascending: true
            });


    if (error) {

        console.error(
            "خطأ تحميل الدورات:",
            error
        );

        select.innerHTML = `
            <option value="">
                تعذر تحميل الدورات
            </option>
        `;

        return;
    }


    select.innerHTML = `
        <option value="">
            اختر الدورة
        </option>
    `;


    if (!data || data.length === 0) {

        select.innerHTML = `
            <option value="">
                لا توجد دورات
            </option>
        `;

        return;
    }


    data.forEach(function(course) {

        const option =
            document.createElement("option");

        option.value =
            course.id;

        option.textContent =
            course.name;

        select.appendChild(option);

    });

}


async function addLesson() {

    const title =
        document.getElementById("lessonTitle")
            .value.trim();


    const courseId =
        document.getElementById("lessonCourse")
            .value;


    const content =
        document.getElementById("lessonContent")
            .value.trim();


    const file =
        document.getElementById("lessonFile")
            .files[0];


    const message =
        document.getElementById("message");


    if (
        title === "" ||
        courseId === "" ||
        content === ""
    ) {

        message.textContent =
            "يرجى ملء عنوان الدرس والدورة والمحتوى";

        message.style.color =
            "red";

        return;
    }


    if (!file) {

        message.textContent =
            "يرجى اختيار ملف PDF";

        message.style.color =
            "red";

        return;
    }


    if (file.type !== "application/pdf") {

        message.textContent =
            "الملف يجب أن يكون بصيغة PDF";

        message.style.color =
            "red";

        return;
    }


    message.textContent =
        "جاري رفع ملف PDF...";

    message.style.color =
        "black";


    const fileName =
        Date.now() + "_" + file.name;


    const { error: uploadError } =
        await supabaseClient
            .storage
            .from("lesson-files")
            .upload(
                fileName,
                file
            );


    if (uploadError) {

        console.error(
            "خطأ رفع PDF:",
            uploadError
        );

        message.textContent =
            "حدث خطأ أثناء رفع ملف PDF";

        message.style.color =
            "red";

        return;
    }


    const { data: urlData } =
    supabaseClient
        .storage
        .from("lesson-files")
        .getPublicUrl(fileName);

const pdfUrl =
    urlData.publicUrl;


    const { error: lessonError } =
        await supabaseClient
            .from("lessons")
            .insert({

                course_id:
                    courseId,

                title:
                    title,

                content:
                    content,

                pdf_url:
                    pdfUrl

            });


    if (lessonError) {

        console.error(
            "خطأ حفظ الدرس:",
            lessonError
        );

        message.textContent =
            "تم رفع PDF لكن حدث خطأ أثناء حفظ الدرس";

        message.style.color =
            "red";

        return;
    }


    message.textContent =
        "تم حفظ الدرس وملف PDF بنجاح ✅";

    message.style.color =
        "green";


    document.getElementById(
        "lessonTitle"
    ).value = "";


    document.getElementById(
        "lessonCourse"
    ).value = "";


    document.getElementById(
        "lessonContent"
    ).value = "";


    document.getElementById(
        "lessonFile"
    ).value = "";

}


loadCourses();

</script>


</body>

</html>
