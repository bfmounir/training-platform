<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>إدارة الدروس</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f8;
        }

        header {
            background: #1565c0;
            color: white;
            padding: 25px 20px;
            text-align: center;
        }

        header h1 {
            margin: 0 0 8px;
        }

        .container {
            max-width: 1000px;
            margin: 30px auto;
            padding: 20px;
        }

        .box {
            background: white;
            padding: 25px;
            border-radius: 12px;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        h2 {
            color: #1565c0;
            margin-top: 0;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 6px;
            font-weight: bold;
        }

        input,
        textarea,
        select {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 7px;
            font-size: 15px;
        }

        textarea {
            min-height: 150px;
            resize: vertical;
        }

        button {
            background: #1565c0;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 7px;
            cursor: pointer;
            font-size: 15px;
        }

        button:hover {
            opacity: 0.9;
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .back {
            background: #555;
            margin-top: 10px;
        }

        .message {
            margin-top: 15px;
            padding: 12px;
            border-radius: 7px;
            font-weight: bold;
            display: none;
        }

        .success {
            background: #e8f5e9;
            color: #2e7d32;
        }

        .error {
            background: #ffebee;
            color: #c62828;
        }

        .info {
            background: #e3f2fd;
            color: #1565c0;
            padding: 12px;
            border-radius: 7px;
            margin-bottom: 15px;
        }

        .loading {
            text-align: center;
            padding: 20px;
        }

    </style>

</head>


<body>


<header>

    <h1>
        📖 إدارة الدروس
    </h1>

    <p>
        لوحة تحكم المسؤول
    </p>

</header>


<div class="container">


    <!-- التحقق من المسؤول -->

    <div
        id="loadingBox"
        class="box loading"
    >
        ⏳ جاري التحقق من صلاحيات المسؤول...
    </div>


    <!-- المحتوى -->

    <div
        id="adminContent"
        style="display:none;"
    >


        <div class="box">

            <h2>
                ➕ إضافة درس جديد
            </h2>


            <div class="info">

                يمكنك إضافة درس وربطه بإحدى الدورات
                مع ملف PDF.

            </div>


            <label>
                عنوان الدرس
            </label>

            <input
                type="text"
                id="lessonTitle"
                placeholder="مثال: مبادئ الإسعافات الأولية"
            >


            <label>
                الدورة التكوينية
            </label>

            <select id="lessonCourse">

                <option value="">
                    جاري تحميل الدورات...
                </option>

            </select>


            <label>
                ملف الدرس PDF
            </label>

            <input
                type="file"
                id="lessonFile"
                accept="application/pdf"
            >


            <label>
                محتوى الدرس
            </label>

            <textarea
                id="lessonContent"
                placeholder="اكتب محتوى الدرس هنا..."
            ></textarea>


            <button
                id="addButton"
                type="button"
                onclick="addLesson()"
            >
                ➕ إضافة الدرس
            </button>


            <div
                id="message"
                class="message"
            ></div>

        </div>


        <div class="box">

            <button
                class="back"
                type="button"
                onclick="window.location.href='admin.html'"
            >
                ⬅️ العودة إلى لوحة المسؤول
            </button>

        </div>


    </div>


</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="supabase-config.js"></script>


<script>


/* =====================================================
   التحقق من المستخدم
===================================================== */

async function checkAdmin() {

    const loadingBox =
        document.getElementById(
            "loadingBox"
        );


    const adminContent =
        document.getElementById(
            "adminContent"
        );


    const {
        data,
        error
    } =
    await supabaseClient.auth.getUser();


    if (
        error ||
        !data ||
        !data.user
    ) {

        loadingBox.textContent =
            "⛔ يجب تسجيل الدخول أولًا.";

        setTimeout(function() {

            window.location.href =
                "login.html";

        }, 1200);

        return;

    }


    const user =
        data.user;


    /* التحقق من جدول الصلاحيات */

    const {
        data: roleData,
        error: roleError
    } =
    await supabaseClient
        .from("user_roles")
        .select("role")
        .eq(
            "user_id",
            user.id
        )
        .maybeSingle();


    if (
        roleError ||
        !roleData ||
        roleData.role !== "admin"
    ) {

        console.error(
            "خطأ الصلاحية:",
            roleError
        );


        loadingBox.textContent =
            "⛔ ليس لديك صلاحية المسؤول.";

        setTimeout(function() {

            window.location.href =
                "trainee.html";

        }, 1500);

        return;

    }


    loadingBox.style.display =
        "none";


    adminContent.style.display =
        "block";


    await loadCourses();

}


/* =====================================================
   تحميل الدورات
===================================================== */

async function loadCourses() {

    const select =
        document.getElementById(
            "lessonCourse"
        );


    const {
        data,
        error
    } =
    await supabaseClient
        .from("courses")
        .select(
            "id, name"
        )
        .order(
            "name",
            {
                ascending: true
            }
        );


    if (error) {

        console.error(error);


        select.innerHTML = `

            <option value="">
                تعذر تحميل الدورات
            </option>

        `;

        return;

    }


    select.innerHTML = `

        <option value="">
            اختر الدورة
        </option>

    `;


    if (
        !data ||
        data.length === 0
    ) {

        select.innerHTML = `

            <option value="">
                لا توجد دورات
            </option>

        `;

        return;

    }


    data.forEach(function(course) {

        const option =
            document.createElement(
                "option"
            );


        option.value =
            course.id;


        option.textContent =
            course.name;


        select.appendChild(
            option
        );

    });

}


/* =====================================================
   إضافة الدرس
===================================================== */

async function addLesson() {

    const title =
        document.getElementById(
            "lessonTitle"
        ).value.trim();


    const courseId =
        document.getElementById(
            "lessonCourse"
        ).value;


    const content =
        document.getElementById(
            "lessonContent"
        ).value.trim();


    const file =
        document.getElementById(
            "lessonFile"
        ).files[0];


    const message =
        document.getElementById(
            "message"
        );


    const button =
        document.getElementById(
            "addButton"
        );


    message.style.display =
        "block";


    /* التحقق */

    if (
        title === "" ||
        courseId === "" ||
        content === ""
    ) {

        message.textContent =
            "يرجى ملء عنوان الدرس والدورة والمحتوى.";

        message.className =
            "message error";

        return;

    }


    if (!file) {

        message.textContent =
            "يرجى اختيار ملف PDF.";

        message.className =
            "message error";

        return;

    }


    if (
        file.type !==
        "application/pdf"
    ) {

        message.textContent =
            "الملف يجب أن يكون بصيغة PDF.";

        message.className =
            "message error";

        return;

    }


    /* الحد الأقصى 20 MB */

    if (
        file.size >
        20 * 1024 * 1024
    ) {

        message.textContent =
            "حجم ملف PDF يجب ألا يتجاوز 20 ميغابايت.";

        message.className =
            "message error";

        return;

    }


    button.disabled =
        true;


    message.textContent =
        "⏳ جاري رفع ملف PDF...";

    message.className =
        "message";



    /* =================================================
       اسم الملف
    ================================================= */

    const safeName =
        file.name
            .replace(
                /[^a-zA-Z0-9._-]/g,
                "_"
            );


    const fileName =
        Date.now() +
        "_" +
        safeName;



    /* =================================================
       رفع الملف
       
       اسم الـBucket الصحيح:
       Lessons-files
    ================================================= */

    const {
        error: uploadError
    } =
    await supabaseClient
        .storage
        .from("Lessons-files")
        .upload(
            fileName,
            file,
            {
                contentType:
                    "application/pdf",

                upsert:
                    false
            }
        );


    if (uploadError) {

        console.error(
            "خطأ رفع PDF:",
            uploadError
        );


        message.textContent =
            "❌ فشل رفع ملف PDF: " +
            uploadError.message;

        message.className =
            "message error";


        button.disabled =
            false;

        return;

    }



    /* =================================================
       الحصول على الرابط
    ================================================= */

    const {
        data: urlData
    } =
    supabaseClient
        .storage
        .from("Lessons-files")
        .getPublicUrl(
            fileName
        );


    const pdfUrl =
        urlData.publicUrl;



    /* =================================================
       حفظ الدرس في جدول lessons
    ================================================= */

    const {
        error: lessonError
    } =
    await supabaseClient
        .from("lessons")
        .insert({

            course_id:
                courseId,

            title:
                title,

            content:
                content,

            pdf_url:
                pdfUrl

        });


    if (lessonError) {

        console.error(
            "خطأ حفظ الدرس:",
            lessonError
        );


        message.textContent =
            "⚠️ تم رفع PDF لكن تعذر حفظ بيانات الدرس: " +
            lessonError.message;

        message.className =
            "message error";


        button.disabled =
            false;

        return;

    }



    /* =================================================
       نجاح
    ================================================= */

    message.textContent =
        "✅ تم حفظ الدرس ورفع ملف PDF بنجاح.";

    message.className =
        "message success";


    document.getElementById(
        "lessonTitle"
    ).value = "";


    document.getElementById(
        "lessonCourse"
    ).value = "";


    document.getElementById(
        "lessonContent"
    ).value = "";


    document.getElementById(
        "lessonFile"
    ).value = "";


    button.disabled =
        false;

}


/* =====================================================
   تشغيل الصفحة
===================================================== */

checkAdmin();


</script>


</body>

</html>
