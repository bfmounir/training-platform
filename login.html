<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>تسجيل الدخول - منصة التكوين</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, Tahoma, sans-serif;
            background: linear-gradient(135deg, #0f766e, #164e63);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .login-box {
            width: 100%;
            max-width: 430px;
            background: white;
            border-radius: 25px;
            padding: 35px;
            box-shadow: 0 20px 50px rgba(0,0,0,.25);
        }

        .logo {
            width: 90px;
            height: 90px;
            margin: auto;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #ecfdf5;
            font-size: 45px;
        }

        h1 {
            text-align: center;
            color: #134e4a;
            margin: 20px 0 8px;
            font-size: 25px;
        }

        .subtitle {
            text-align: center;
            color: #64748b;
            line-height: 1.7;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            color: #334155;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 14px;
            border: 1px solid #cbd5e1;
            border-radius: 12px;
            margin-bottom: 18px;
            font-size: 16px;
            outline: none;
        }

        input:focus {
            border-color: #0f766e;
            box-shadow: 0 0 0 3px rgba(15,118,110,.12);
        }

        button {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 12px;
            background: #0f766e;
            color: white;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #115e59;
        }

        button:disabled {
            opacity: .6;
            cursor: not-allowed;
        }

        #message {
            margin-top: 18px;
            padding: 12px;
            border-radius: 10px;
            text-align: center;
            display: none;
            line-height: 1.6;
        }

        .error {
            background: #fee2e2;
            color: #991b1b;
        }

        .success {
            background: #dcfce7;
            color: #166534;
        }

        .footer {
            text-align: center;
            margin-top: 25px;
            color: #64748b;
            font-size: 13px;
            line-height: 1.8;
        }
    </style>
</head>

<body>

<div class="login-box">

    <div class="logo">🎓</div>

    <h1>منصة التكوين المستمر</h1>

    <div class="subtitle">
        المؤسسة العمومية الإستشفائية بأولف<br>
        ولاية أدرار
    </div>

    <form id="loginForm">

        <label for="email">البريد الإلكتروني</label>
        <input
            type="email"
            id="email"
            placeholder="أدخل البريد الإلكتروني"
            required
        >

        <label for="password">كلمة المرور</label>
        <input
            type="password"
            id="password"
            placeholder="أدخل كلمة المرور"
            required
        >

        <button id="loginButton" type="submit">
            تسجيل الدخول
        </button>

    </form>

    <div id="message"></div>

    <div class="footer">
        رئيس مكتب التكوين المتواصل: بن صغير منير<br>
        الهاتف: 0660.48.43.73
    </div>

</div>

<script>

const loginForm = document.getElementById("loginForm");
const loginButton = document.getElementById("loginButton");
const message = document.getElementById("message");

function showMessage(text, type) {
    message.textContent = text;
    message.className = type;
    message.style.display = "block";
}

loginForm.addEventListener("submit", async function(event) {

    event.preventDefault();

    loginButton.disabled = true;
    loginButton.textContent = "جارٍ تسجيل الدخول...";

    message.style.display = "none";

    const email =
        document.getElementById("email").value.trim();

    const password =
        document.getElementById("password").value;

    try {

        const { data, error } =
            await supabaseClient.auth.signInWithPassword({
                email: email,
                password: password
            });

        if (error) {
            throw new Error(
                "بيانات الدخول غير صحيحة: " + error.message
            );
        }

        const user = data.user;

        if (!user) {
            throw new Error("تعذر الحصول على بيانات المستخدم.");
        }

        const { data: roleData, error: roleError } =
            await supabaseClient
                .from("user_roles")
                .select("role")
                .eq("user_id", user.id)
                .maybeSingle();

        if (roleError) {
            throw new Error(
                "تعذر قراءة صلاحية المستخدم: " +
                roleError.message
            );
        }

        if (!roleData) {
            throw new Error(
                "هذا الحساب لا توجد له صلاحية محددة في المنصة."
            );
        }

        const role = roleData.role;

        showMessage(
            "تم تسجيل الدخول بنجاح، جارٍ فتح المنصة...",
            "success"
        );

        /*
           مهم:
           نستعمل أسماء ملفات بحروف صغيرة
           لتجنب مشكلة 404 في GitHub Pages.
        */

        if (role === "admin") {

            window.location.href = "admin.html";

        } else if (role === "trainee") {

            window.location.href = "trainee.html";

        } else if (role === "trainer") {

            window.location.href = "trainer.html";

        } else {

            throw new Error(
                "صلاحية غير معروفة: " + role
            );
        }

    } catch (error) {

        console.error(error);

        showMessage(
            error.message,
            "error"
        );

        loginButton.disabled = false;
        loginButton.textContent = "تسجيل الدخول";
    }

});

</script>

</body>
</html>
