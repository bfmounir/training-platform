<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>تسجيل الدخول - منصة التكوين المتواصل</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    font-family: Tahoma, Arial, sans-serif;

    background:
        radial-gradient(circle at 10% 20%,
        rgba(24,166,166,.25),
        transparent 30%),

        radial-gradient(circle at 90% 80%,
        rgba(13,110,253,.25),
        transparent 30%),

        linear-gradient(
            135deg,
            #062d5c,
            #0d6efd,
            #159f9f
        );

    display: flex;
    align-items: center;
    justify-content: center;

    padding: 20px;
}

.login-box {

    width: 100%;
    max-width: 430px;

    background: rgba(255,255,255,.98);

    border-radius: 25px;

    padding: 35px 28px;

    box-shadow:
        0 25px 70px rgba(0,0,0,.25);

}

.logo {
    text-align: center;
    margin-bottom: 15px;
}

.logo img {
    width: 90px;
    height: 90px;
    object-fit: contain;
}

h1 {
    text-align: center;
    color: #073b78;
    margin: 10px 0;
    font-size: 24px;
}

.subtitle {
    text-align: center;
    color: #667085;
    font-size: 14px;
    line-height: 1.8;
    margin-bottom: 25px;
}

.field {
    margin-bottom: 17px;
}

label {
    display: block;
    margin-bottom: 7px;
    color: #344054;
    font-weight: bold;
}

input {
    width: 100%;
    height: 52px;

    padding: 0 14px;

    border: 1px solid #d9e2ec;

    border-radius: 12px;

    font-size: 15px;

    outline: none;

    background: #f8fafc;
}

input:focus {
    border-color: #0d6efd;

    box-shadow:
        0 0 0 4px rgba(13,110,253,.10);
}

button {

    width: 100%;

    height: 54px;

    border: none;

    border-radius: 13px;

    background:
        linear-gradient(
            135deg,
            #073b78,
            #0d6efd,
            #159f9f
        );

    color: white;

    font-size: 16px;

    font-weight: bold;

    cursor: pointer;

}

button:disabled {
    opacity: .7;
}

#message {

    margin-top: 20px;

    padding: 15px;

    border-radius: 12px;

    line-height: 1.8;

    font-size: 14px;

    white-space: pre-wrap;

    word-break: break-word;

    display: none;
}

.info {
    display: block !important;

    background: #eef8ff;

    color: #075985;

    border: 1px solid #b8dff5;
}

.success {
    display: block !important;

    background: #effaf3;

    color: #166534;

    border: 1px solid #b8e1c5;
}

.error {
    display: block !important;

    background: #fff1f1;

    color: #991b1b;

    border: 1px solid #efb5b5;
}

.home {
    display: block;

    text-align: center;

    margin-top: 20px;

    color: #0d6efd;

    text-decoration: none;

    font-weight: bold;
}

.footer {
    text-align: center;

    color: white;

    font-size: 13px;

    line-height: 1.8;

    margin-top: 18px;
}

</style>

</head>


<body>


<div>

<div class="login-box">


<div class="logo">

<img src="logo.png"
     alt="شعار المؤسسة">

</div>


<h1>
منصة التكوين المتواصل
</h1>


<div class="subtitle">

المؤسسة العمومية الإستشفائية بأولف ولاية أدرار

<br>

تسجيل الدخول إلى حسابك

</div>


<div class="field">

<label>
البريد الإلكتروني
</label>

<input
    type="email"
    id="email"
    placeholder="أدخل البريد الإلكتروني"
    autocomplete="email">

</div>


<div class="field">

<label>
كلمة المرور
</label>

<input
    type="password"
    id="password"
    placeholder="أدخل كلمة المرور"
    autocomplete="current-password">

</div>


<button
    id="loginButton"
    onclick="login()">

🔐 تسجيل الدخول

</button>


<div id="message"></div>


<a href="index.html"
   class="home">

← العودة إلى الصفحة الرئيسية

</a>


</div>


<div class="footer">

رئيس مكتب التكوين المتواصل: بن صغير منير

<br>

0660.48.43.73

</div>

</div>



<!-- Supabase -->

<script src="supabase-config.js"></script>


<script>


/* =========================================
   عرض الرسالة
========================================= */

function showMessage(text, type) {

    const message =
        document.getElementById("message");

    message.className = type;

    message.textContent = text;

}



/* =========================================
   تسجيل الدخول
========================================= */

async function login() {


    const email =
        document.getElementById("email")
        .value
        .trim();


    const password =
        document.getElementById("password")
        .value;


    const button =
        document.getElementById("loginButton");


    if (!email || !password) {

        showMessage(
            "⚠️ أدخل البريد الإلكتروني وكلمة المرور.",
            "error"
        );

        return;

    }


    button.disabled = true;

    button.textContent =
        "جارٍ التحقق...";


    try {


        /* ==============================
           المرحلة 1
        ============================== */

        showMessage(
            "المرحلة 1/4\n\nجارٍ تسجيل الدخول...",
            "info"
        );


        const {
            data: authData,
            error: authError
        } =
        await supabaseClient.auth.signInWithPassword({

            email: email,

            password: password

        });


        if (authError) {

            throw new Error(
                "فشل تسجيل الدخول:\n\n" +
                authError.message
            );

        }


        if (!authData.user) {

            throw new Error(
                "لم يتم العثور على بيانات المستخدم."
            );

        }


        const user =
            authData.user;


        /* ==============================
           المرحلة 2
        ============================== */

        showMessage(

            "المرحلة 2/4\n\n" +

            "تم تسجيل الدخول بنجاح ✅\n\n" +

            "البريد الإلكتروني:\n" +

            user.email +

            "\n\n" +

            "User ID:\n" +

            user.id +

            "\n\n" +

            "جارٍ التحقق من جدول الصلاحيات...",

            "info"

        );


        console.log(
            "USER ID:",
            user.id
        );


        /* ==============================
           المرحلة 3
        ============================== */

        const roleResult =
            await supabaseClient
            .from("user_roles")
            .select("role")
            .eq("user_id", user.id)
            .maybeSingle();


        console.log(
            "ROLE RESULT:",
            roleResult
        );


        /* خطأ في قاعدة البيانات */

        if (roleResult.error) {

            await supabaseClient.auth.signOut();


            showMessage(

                "❌ المرحلة 3/4: خطأ في قراءة الصلاحية\n\n" +

                "رسالة Supabase:\n" +

                roleResult.error.message +

                "\n\n" +

                "رمز الخطأ:\n" +

                (
                    roleResult.error.code ||
                    "غير موجود"
                ) +

                "\n\n" +

                "User ID:\n" +

                user.id,

                "error"

            );


            return;

        }


        /* لا توجد صلاحية */

        if (!roleResult.data) {

            await supabaseClient.auth.signOut();


            showMessage(

                "❌ المرحلة 3/4\n\n" +

                "تم تسجيل الدخول بنجاح، ولكن لم يتم العثور على صلاحية لهذا الحساب.\n\n" +

                "User ID:\n" +

                user.id +

                "\n\n" +

                "لا يوجد سجل مطابق في جدول user_roles.",

                "error"

            );


            return;

        }


        /* ==============================
           المرحلة 4
        ============================== */

        const role =
            roleResult.data.role;


        console.log(
            "ROLE:",
            role
        );


        showMessage(

            "✅ تم التحقق من الحساب بنجاح\n\n" +

            "البريد الإلكتروني:\n" +

            user.email +

            "\n\n" +

            "User ID:\n" +

            user.id +

            "\n\n" +

            "الصلاحية:\n" +

            role +

            "\n\n" +

            "جارٍ فتح الصفحة...",

            "success"

        );


        /* ==============================
           التحويل
        ============================== */

        setTimeout(function () {


            if (role === "admin") {

                window.location.href =
                    "admin.html";

                return;

            }


            if (role === "trainee") {

                window.location.href =
                    "Trainee.html";

                return;

            }


            if (role === "trainer") {

                window.location.href =
                    "Trainer.html";

                return;

            }


            showMessage(

                "⚠️ الحساب موجود ولكن الصلاحية غير معروفة.\n\n" +

                "الصلاحية الموجودة:\n" +

                role,

                "error"

            );


        }, 1200);


    }

    catch (error) {


        console.error(
            "LOGIN ERROR:",
            error
        );


        showMessage(

            "❌ حدث خطأ\n\n" +

            error.message,

            "error"

        );

    }


    finally {

        button.disabled = false;

        button.textContent =
            "🔐 تسجيل الدخول";

    }

}


</script>


</body>

</html>
