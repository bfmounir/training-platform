<!DOCTYPE html>

<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport"
   content="width=device-width, initial-scale=1.0">

<title>تسجيل الدخول - منصة التكوين</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="supabase-config.js"></script>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, Tahoma, sans-serif;

    background:
        linear-gradient(
            135deg,
            #0f766e,
            #164e63
        );

    min-height: 100vh;

    display: flex;
    justify-content: center;
    align-items: center;

    padding: 20px;
}

.login-box {

    width: 100%;
    max-width: 430px;

    background: #ffffff;

    border-radius: 25px;

    padding: 35px;

    box-shadow:
        0 20px 50px rgba(0,0,0,.25);
}

.logo {

    width: 90px;
    height: 90px;

    margin: auto;

    border-radius: 50%;

    display: flex;

    align-items: center;
    justify-content: center;

    background: #ecfdf5;

    font-size: 45px;
}

h1 {

    text-align: center;

    color: #134e4a;

    margin:
        20px 0 8px;

    font-size: 25px;
}

.subtitle {

    text-align: center;

    color: #64748b;

    line-height: 1.8;

    margin-bottom: 28px;

    font-size: 15px;
}

label {

    display: block;

    margin-bottom: 7px;

    color: #334155;

    font-weight: bold;
}

input {

    width: 100%;

    padding: 14px;

    border:
        1px solid #cbd5e1;

    border-radius: 12px;

    margin-bottom: 18px;

    font-size: 16px;

    outline: none;

    transition: .2s;
}

input:focus {

    border-color: #0f766e;

    box-shadow:
        0 0 0 3px
        rgba(15,118,110,.12);
}

.login-button {

    width: 100%;

    padding: 15px;

    border: none;

    border-radius: 12px;

    background: #0f766e;

    color: white;

    font-size: 17px;

    font-weight: bold;

    cursor: pointer;

    transition: .2s;
}

.login-button:hover {

    background: #115e59;
}

.login-button:disabled {

    opacity: .6;

    cursor: not-allowed;
}

.register-area {

    margin-top: 22px;

    padding-top: 20px;

    border-top:
        1px solid #e2e8f0;

    text-align: center;
}

.register-text {

    color: #64748b;

    font-size: 14px;

    margin-bottom: 10px;
}

.register-button {

    display: block;

    width: 100%;

    padding: 13px;

    border:
        2px solid #0f766e;

    border-radius: 12px;

    color: #0f766e;

    background: #ffffff;

    text-decoration: none;

    font-size: 16px;

    font-weight: bold;

    transition: .2s;
}

.register-button:hover {

    background: #ecfdf5;

    transform: translateY(-1px);
}

#message {

    margin-top: 18px;

    padding: 12px;

    border-radius: 10px;

    text-align: center;

    display: none;

    line-height: 1.7;

    font-size: 14px;
}

.error {

    background: #fee2e2;

    color: #991b1b;

    border:
        1px solid #fecaca;
}

.success {

    background: #dcfce7;

    color: #166534;

    border:
        1px solid #bbf7d0;
}

.footer {

    text-align: center;

    margin-top: 25px;

    color: #64748b;

    font-size: 13px;

    line-height: 1.8;
}

@media (max-width: 480px) {

    body {
        padding: 12px;
    }

    .login-box {

        padding: 25px 20px;

        border-radius: 20px;
    }

    h1 {

        font-size: 22px;
    }

    .logo {

        width: 75px;
        height: 75px;

        font-size: 38px;
    }
}

</style>

</head>

<body>

<div class="login-box">

```
<div class="logo">
    🎓
</div>

<h1>
    منصة التكوين المستمر
</h1>

<div class="subtitle">

    المؤسسة العمومية الإستشفائية بأولف<br>

    ولاية أدرار

</div>

<!-- تسجيل الدخول -->

<form id="loginForm">

    <label for="email">
        البريد الإلكتروني
    </label>

    <input
        type="email"
        id="email"
        placeholder="أدخل البريد الإلكتروني"
        autocomplete="email"
        required
    >

    <label for="password">
        كلمة المرور
    </label>

    <input
        type="password"
        id="password"
        placeholder="أدخل كلمة المرور"
        autocomplete="current-password"
        required
    >

    <button
        id="loginButton"
        class="login-button"
        type="submit"
    >

        تسجيل الدخول

    </button>

</form>

<!-- التسجيل الجديد -->

<div class="register-area">

    <div class="register-text">

        ليس لديك حساب متربص؟

    </div>

    <a
        href="register.html"
        class="register-button"
    >

        📝 تسجيل متربص جديد

    </a>

</div>

<!-- الرسائل -->

<div id="message"></div>

<!-- التذييل -->

<div class="footer">

    رئيس مكتب التكوين المتواصل:
    بن صغير منير

    <br>

    الهاتف:
    0660.48.43.73

</div>
```

</div>

<script>

const loginForm =
    document.getElementById("loginForm");

const loginButton =
    document.getElementById("loginButton");

const message =
    document.getElementById("message");


/* عرض الرسائل */

function showMessage(text, type) {

    message.textContent = text;

    message.className = type;

    message.style.display = "block";
}


/* تسجيل الدخول */

loginForm.addEventListener(
    "submit",
    async function(event) {

        event.preventDefault();

        loginButton.disabled = true;

        loginButton.textContent =
            "جارٍ تسجيل الدخول...";

        message.style.display =
            "none";


        const email =
            document
                .getElementById("email")
                .value
                .trim()
                .toLowerCase();


        const password =
            document
                .getElementById("password")
                .value;


        try {

            /*
             * تسجيل الدخول في Supabase
             */

            const {
                data,
                error
            } =
                await supabaseClient.auth
                    .signInWithPassword({

                        email: email,

                        password: password

                    });


            /*
             * عرض رسالة Supabase الأصلية
             * لمعرفة سبب الخطأ الحقيقي
             */

            if (error) {

                console.error(
                    "Login Error:",
                    error
                );

                throw new Error(
                    "Supabase: " +
                    error.message
                );
            }


            const user =
                data.user;


            if (!user) {

                throw new Error(
                    "تعذر الحصول على بيانات المستخدم."
                );
            }


            console.log(
                "User ID:",
                user.id
            );


            /*
             * قراءة صلاحية المستخدم الحالية
             */

            const {
                data: roleData,
                error: roleError
            } =
                await supabaseClient
                    .from("user_roles")
                    .select("role")
                    .eq(
                        "user_id",
                        user.id
                    )
                    .maybeSingle();


            if (roleError) {

                console.error(
                    "Role Error:",
                    roleError
                );

                throw new Error(
                    "تم تسجيل الدخول، لكن تعذر قراءة صلاحية المستخدم: " +
                    roleError.message
                );
            }


            if (!roleData) {

                throw new Error(
                    "تم تسجيل الدخول، لكن لم يتم تحديد صلاحية لهذا الحساب بعد."
                );
            }


            const role =
                roleData.role;


            console.log(
                "User Role:",
                role
            );


            showMessage(
                "تم تسجيل الدخول بنجاح، جارٍ فتح المنصة...",
                "success"
            );


            /*
             * تحويل المستخدم حسب الصلاحية
             */

            if (
                role === "admin"
            ) {

                window.location.href =
                    "admin.html";

            }

            else if (
                role === "trainee"
            ) {

                window.location.href =
                    "trainee.html";

            }

            else if (
                role === "trainer"
            ) {

                window.location.href =
                    "trainer.html";

            }

            else if (
                role === "worker"
            ) {

                /*
                 * مؤقتًا نوجه العامل إلى صفحة المتربص
                 * إلى أن يتم إنشاء صفحة الموظف الخاصة به.
                 */

                window.location.href =
                    "trainee.html";

            }

            else {

                throw new Error(
                    "صلاحية غير معروفة: " +
                    role
                );
            }

        }

        catch (error) {

            console.error(
                "Login Error:",
                error
            );


            showMessage(
                error.message,
                "error"
            );


            loginButton.disabled =
                false;

            loginButton.textContent =
                "تسجيل الدخول";
        }

    });

</script>

</body>

</html>
