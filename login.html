</div>

<script>

const loginForm = document.getElementById("loginForm");
const loginButton = document.getElementById("loginButton");
const message = document.getElementById("message");

function showMessage(text, type) {

    message.textContent = text;
    message.className = type;
    message.style.display = "block";
}

loginForm.addEventListener("submit", async function(event) {

    event.preventDefault();

    loginButton.disabled = true;
    loginButton.textContent = "جارٍ تسجيل الدخول...";

    message.style.display = "none";

    const email =
        document.getElementById("email").value.trim().toLowerCase();

    const password =
        document.getElementById("password").value;

    try {

        /*
         * تسجيل الدخول
         */

        const { data, error } =
            await supabaseClient.auth.signInWithPassword({
                email: email,
                password: password
            });

        if (error) {

            console.error("Supabase Login Error:", error);

            /*
             * نعرض رسالة مفهومة حسب نوع الخطأ
             */

            if (
                error.message &&
                error.message.toLowerCase().includes("email not confirmed")
            ) {

                throw new Error(
                    "الحساب موجود، لكن البريد الإلكتروني غير مؤكد في Supabase."
                );

            } else if (
                error.message &&
                (
                    error.message.toLowerCase().includes("invalid login credentials") ||
                    error.message.toLowerCase().includes("invalid credentials")
                )
            ) {

                throw new Error(
                    "البريد الإلكتروني أو كلمة المرور غير صحيحة."
                );

            } else {

                throw new Error(
                    "تعذر تسجيل الدخول: " + error.message
                );
            }
        }

        const user = data.user;

        if (!user) {
            throw new Error(
                "تمت عملية الدخول ولكن تعذر الحصول على بيانات المستخدم."
            );
        }

        console.log("تم تسجيل الدخول للمستخدم:", user.id);

        /*
         * البحث عن صلاحية المستخدم
         */

        const { data: roleData, error: roleError } =
            await supabaseClient
                .from("user_roles")
                .select("role")
                .eq("user_id", user.id)
                .maybeSingle();

        if (roleError) {

            console.error("Role Error:", roleError);

            throw new Error(
                "تم تسجيل الدخول، لكن تعذر قراءة صلاحية المستخدم."
            );
        }

        if (!roleData) {

            throw new Error(
                "تم تسجيل الدخول، لكن هذا الحساب لم تُحدد له صلاحية في المنصة بعد."
            );
        }

        const role = roleData.role;

        console.log("صلاحية المستخدم:", role);

        showMessage(
            "تم تسجيل الدخول بنجاح، جارٍ فتح المنصة...",
            "success"
        );

        /*
         * توجيه المستخدم حسب الصلاحية
         */

        if (role === "admin") {

            window.location.href = "admin.html";

        } else if (role === "trainee") {

            window.location.href = "trainee.html";

        } else if (role === "trainer") {

            window.location.href = "trainer.html";

        } else {

            throw new Error(
                "صلاحية غير معروفة: " + role
            );
        }

    } catch (error) {

        console.error("Login Error:", error);

        showMessage(
            error.message,
            "error"
        );

        loginButton.disabled = false;
        loginButton.textContent = "تسجيل الدخول";
    }

});

</script>
