<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>تسجيل الدخول - منصة التكوين المتواصل</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background:
                linear-gradient(135deg, #073b4c, #087f8c);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .page {
            width: 100%;
            max-width: 450px;
        }

        .card {
            background: #ffffff;
            border-radius: 25px;
            padding: 35px 28px;
            box-shadow:
                0 25px 60px rgba(0, 0, 0, 0.25);
        }

        .logo {
            text-align: center;
            margin-bottom: 15px;
        }

        .logo img {
            width: 95px;
            height: 95px;
            object-fit: contain;
        }

        h1 {
            text-align: center;
            color: #073b4c;
            font-size: 27px;
            margin: 8px 0;
        }

        .subtitle {
            text-align: center;
            color: #687887;
            font-size: 14px;
            line-height: 1.8;
            margin-bottom: 30px;
        }

        .field {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #17324d;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 15px;
            border: 1px solid #dce6ec;
            border-radius: 13px;
            outline: none;
            font-size: 16px;
            background: #fafdff;
        }

        input:focus {
            border-color: #087f8c;
            box-shadow:
                0 0 0 3px rgba(8, 127, 140, 0.12);
        }

        .login-btn {
            width: 100%;
            border: 0;
            border-radius: 13px;
            padding: 16px;
            margin-top: 5px;
            background:
                linear-gradient(135deg, #087f8c, #075c66);
            color: white;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        .login-btn:hover {
            transform: translateY(-1px);
        }

        .login-btn:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none;
        }

        #message {
            display: none;
            margin-top: 20px;
            padding: 16px;
            border-radius: 13px;
            line-height: 1.9;
            font-size: 14px;
            white-space: pre-wrap;
            word-break: break-word;
        }

        #message.info {
            display: block;
            background: #eef8ff;
            border: 1px solid #b9dff4;
            color: #075985;
        }

        #message.success {
            display: block;
            background: #effaf3;
            border: 1px solid #b9e1c5;
            color: #166534;
        }

        #message.error {
            display: block;
            background: #fff1f1;
            border: 1px solid #efb5b5;
            color: #991b1b;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 22px;
            text-decoration: none;
            color: #087f8c;
            font-weight: bold;
        }

        .institution {
            text-align: center;
            color: white;
            font-size: 13px;
            line-height: 1.8;
            margin-top: 20px;
        }

    </style>

</head>


<body>


<div class="page">

    <div class="card">

        <div class="logo">

            <img src="logo.png"
                 alt="شعار المؤسسة">

        </div>


        <h1>
            تسجيل الدخول
        </h1>


        <div class="subtitle">

            منصة التكوين المتواصل

            <br>

            المؤسسة العمومية الإستشفائية بأولف ولاية أدرار

        </div>


        <form id="loginForm">


            <div class="field">

                <label for="email">
                    البريد الإلكتروني
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="أدخل البريد الإلكتروني"
                    autocomplete="email"
                    required>

            </div>


            <div class="field">

                <label for="password">
                    كلمة المرور
                </label>

                <input
                    type="password"
                    id="password"
                    placeholder="أدخل كلمة المرور"
                    autocomplete="current-password"
                    required>

            </div>


            <button
                type="submit"
                id="loginButton"
                class="login-btn">

                تسجيل الدخول

            </button>


        </form>


        <div id="message"></div>


        <a href="index.html"
           class="back">

            ← العودة إلى الصفحة الرئيسية

        </a>

    </div>


    <div class="institution">

        رئيس مكتب التكوين المتواصل: بن صغير منير

        <br>

        الهاتف: 0660.48.43.73

    </div>

</div>



<script src="supabase-config.js"></script>


<script>

document.addEventListener("DOMContentLoaded", function () {


    const form =
        document.getElementById("loginForm");


    const emailInput =
        document.getElementById("email");


    const passwordInput =
        document.getElementById("password");


    const loginButton =
        document.getElementById("loginButton");


    const message =
        document.getElementById("message");



    function showMessage(text, type) {

        message.className = type;

        message.textContent = text;

    }



    /* ==========================================
       التأكد من وجود Supabase
       ========================================== */

    if (typeof supabaseClient === "undefined") {

        showMessage(
            "❌ خطأ في الاتصال\n\n" +
            "لم يتم العثور على supabaseClient.\n\n" +
            "تأكد من أن ملف supabase-config.js موجود في المجلد الرئيسي للمشروع.",
            "error"
        );

        return;

    }



    /* ==========================================
       تسجيل الدخول
       ========================================== */

    form.addEventListener("submit", async function (event) {

        event.preventDefault();


        loginButton.disabled = true;

        loginButton.textContent =
            "جارٍ التحقق...";


        showMessage(
            "المرحلة 1/3\n\nجارٍ التحقق من بيانات الدخول...",
            "info"
        );


        try {


            const email =
                emailInput.value.trim();


            const password =
                passwordInput.value;



            /* ==================================
               تسجيل الدخول في Supabase
               ================================== */

            const {
                data: authData,
                error: authError
            } =
                await supabaseClient.auth.signInWithPassword({

                    email: email,

                    password: password

                });



            if (authError) {

                throw new Error(
                    "فشل تسجيل الدخول:\n\n" +
                    authError.message
                );

            }



            if (!authData || !authData.user) {

                throw new Error(
                    "تم تسجيل الدخول، ولكن لم يتم العثور على بيانات المستخدم."
                );

            }



            const user =
                authData.user;



            console.log(
                "USER ID:",
                user.id
            );


            console.log(
                "USER EMAIL:",
                user.email
            );



            /* ==================================
               البحث عن الصلاحية
               ================================== */

            showMessage(

                "المرحلة 2/3\n\n" +

                "تم تسجيل الدخول بنجاح ✅\n\n" +

                "البريد الإلكتروني:\n" +

                user.email +

                "\n\n" +

                "User ID:\n" +

                user.id +

                "\n\n" +

                "جارٍ البحث عن الصلاحية...",

                "info"

            );



            const roleResult =

                await supabaseClient

                    .from("user_roles")

                    .select("role")

                    .eq("user_id", user.id)

                    .maybeSingle();



            console.log(
                "ROLE RESULT:",
                roleResult
            );



            /* ==================================
               وجود خطأ في قاعدة البيانات
               ================================== */

            if (roleResult.error) {


                await supabaseClient.auth.signOut();


                throw new Error(

                    "حدث خطأ أثناء قراءة جدول الصلاحيات.\n\n" +

                    "رسالة Supabase:\n" +

                    roleResult.error.message +

                    "\n\n" +

                    "رمز الخطأ:\n" +

                    (
                        roleResult.error.code ||
                        "غير متوفر"
                    ) +

                    "\n\n" +

                    "User ID:\n" +

                    user.id

                );

            }



            /* ==================================
               لا توجد صلاحية
               ================================== */

            if (!roleResult.data) {


                await supabaseClient.auth.signOut();


                throw new Error(

                    "تم تسجيل الدخول بنجاح ✅\n\n" +

                    "لكن لم يتم العثور على صلاحية لهذا الحساب.\n\n" +

                    "User ID الخاص بالحساب:\n" +

                    user.id +

                    "\n\n" +

                    "يجب أن يكون هذا الـ User ID موجودًا في جدول user_roles."

                );

            }



            /* ==================================
               تم العثور على الصلاحية
               ================================== */

            const role =
                roleResult.data.role;


            console.log(
                "USER ROLE:",
                role
            );



            showMessage(

                "المرحلة 3/3\n\n" +

                "تم التحقق من الحساب بنجاح ✅\n\n" +

                "البريد الإلكتروني:\n" +

                user.email +

                "\n\n" +

                "User ID:\n" +

                user.id +

                "\n\n" +

                "الصلاحية:\n" +

                role +

                "\n\n" +

                "جارٍ تحويلك إلى الصفحة المناسبة...",

                "success"

            );



            /* ==================================
               تحويل حسب الصلاحية
               ================================== */

            setTimeout(function () {


                if (role === "admin") {

                    window.location.href =
                        "admin.html";

                }


                else if (role === "trainee") {

                    window.location.href =
                        "Trainee.html";

                }


                else if (role === "trainer") {

                    window.location.href =
                        "Trainer.html";

                }


                else {

                    showMessage(

                        "⚠️ تم العثور على الحساب، ولكن الصلاحية غير معروفة.\n\n" +

                        "الصلاحية الموجودة في قاعدة البيانات:\n" +

                        role,

                        "error"

                    );

                }


            }, 1000);


        }


        catch (error) {


            console.error(
                "LOGIN ERROR:",
                error
            );


            showMessage(

                "❌ حدث خطأ أثناء تسجيل الدخول\n\n" +

                error.message,

                "error"

            );

        }


        finally {


            loginButton.disabled = false;

            loginButton.textContent =
                "تسجيل الدخول";

        }

    });

});

</script>


</body>

</html>
