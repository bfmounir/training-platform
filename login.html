<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>تسجيل الدخول - منصة التكوين المتواصل</title>

    <style>

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f8;

            display: flex;
            justify-content: center;
            align-items: center;

            min-height: 100vh;
        }

        .login-box {
            background: white;

            width: 350px;
            max-width: calc(100% - 40px);

            padding: 30px;

            border-radius: 15px;

            box-shadow:
                0 4px 15px rgba(0,0,0,0.15);

            text-align: center;
        }

        .logo {
            font-size: 50px;
            margin-bottom: 10px;
        }

        h1 {
            color: #1565c0;
            font-size: 24px;
            margin-bottom: 10px;
        }

        p {
            color: #666;
        }

        input,
        select {

            width: 100%;

            padding: 12px;

            margin: 10px 0;

            box-sizing: border-box;

            border: 1px solid #ccc;

            border-radius: 8px;

            font-size: 15px;
        }

        button {

            width: 100%;

            padding: 13px;

            margin-top: 15px;

            border: none;

            border-radius: 8px;

            background: #1565c0;

            color: white;

            font-size: 16px;

            cursor: pointer;
        }

        button:hover {
            background: #0d47a1;
        }

        .forgot {

            display: block;

            margin-top: 18px;

            color: #1565c0;

            cursor: pointer;

            text-decoration: underline;

            font-size: 14px;
        }

        .back {

            display: block;

            margin-top: 20px;

            color: #666;

            text-decoration: none;

            font-size: 14px;
        }

        #message {

            margin-top: 18px;

            font-weight: bold;

            line-height: 1.7;

            word-break: break-word;
        }

    </style>

</head>


<body>


<div class="login-box">


    <div class="logo">
        📚
    </div>


    <h1>
        منصة التكوين المتواصل
    </h1>


    <p>
        تسجيل الدخول
    </p>


    <!-- نوع المستخدم -->

    <select id="userType">

        <option value="">
            اختر نوع المستخدم
        </option>

        <option value="admin">
            المسؤول
        </option>

        <option value="trainee">
            المتربص
        </option>

        <option value="worker">
            العامل
        </option>

    </select>


    <!-- البريد -->

    <input
        type="email"
        id="username"
        placeholder="البريد الإلكتروني"
        autocomplete="email"
    >


    <!-- كلمة المرور -->

    <input
        type="password"
        id="password"
        placeholder="كلمة المرور"
        autocomplete="current-password"
    >


    <!-- الدخول -->

    <button
        type="button"
        onclick="login()"
    >
        🔐 تسجيل الدخول
    </button>


    <!-- استعادة كلمة المرور -->

    <span
        class="forgot"
        onclick="resetPassword()"
    >
        نسيت كلمة المرور؟
    </span>


    <p id="message"></p>


    <a
        href="index.html"
        class="back"
    >
        ← العودة إلى الصفحة الرئيسية
    </a>


</div>


<!-- Supabase -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="supabase-config.js"></script>


<script>


/* =====================================================
   تسجيل الدخول
===================================================== */

async function login() {

    const userType =
        document.getElementById(
            "userType"
        ).value;


    const email =
        document.getElementById(
            "username"
        ).value.trim();


    const password =
        document.getElementById(
            "password"
        ).value;


    const message =
        document.getElementById(
            "message"
        );


    /* التحقق من البيانات */

    if (
        userType === "" ||
        email === "" ||
        password === ""
    ) {

        message.textContent =
            "يرجى ملء جميع المعلومات.";

        message.style.color =
            "red";

        return;
    }


    message.textContent =
        "جاري تسجيل الدخول...";

    message.style.color =
        "#1565c0";


    try {


        /* تسجيل الدخول */

        const {
            data,
            error
        } =
            await supabaseClient.auth
                .signInWithPassword({

                    email:
                        email,

                    password:
                        password

                });


        /* خطأ تسجيل الدخول */

        if (error) {

            console.error(
                "خطأ تسجيل الدخول:",
                error
            );

            message.textContent =
                "فشل تسجيل الدخول: " +
                error.message;

            message.style.color =
                "red";

            return;
        }


        const user =
            data.user;


        if (!user) {

            message.textContent =
                "تعذر الحصول على بيانات الحساب.";

            message.style.color =
                "red";

            return;
        }


        /* =================================================
           المسؤول
        ================================================= */

        if (
            userType === "admin"
        ) {


            const {
                data: roleData,
                error: roleError
            } =
                await supabaseClient
                    .from("user_roles")
                    .select("role")
                    .eq(
                        "user_id",
                        user.id
                    )
                    .maybeSingle();


            if (roleError) {

                console.error(
                    "خطأ الصلاحيات:",
                    roleError
                );


                await supabaseClient.auth
                    .signOut();


                message.textContent =
                    "تعذر التحقق من صلاحيات المسؤول: " +
                    roleError.message;

                message.style.color =
                    "red";

                return;
            }


            /* التحقق من admin */

            if (
                !roleData ||
                roleData.role !== "admin"
            ) {

                await supabaseClient.auth
                    .signOut();


                message.textContent =
                    "هذا الحساب ليس لديه صلاحية المسؤول.";

                message.style.color =
                    "red";

                return;
            }


            /* دخول المسؤول */

            message.textContent =
                "تم التحقق من حساب المسؤول ✅";

            message.style.color =
                "green";


            setTimeout(
                function() {

                    window.location.href =
                        "admin.html";

                },
                500
            );


            return;
        }


        /* =================================================
           المتربص
        ================================================= */

        if (
            userType === "trainee"
        ) {

            message.textContent =
                "تم تسجيل الدخول بنجاح ✅";

            message.style.color =
                "green";


            setTimeout(
                function() {

                    window.location.href =
                        "trainee.html";

                },
                500
            );


            return;
        }


        /* =================================================
           العامل
        ================================================= */

        if (
            userType === "worker"
        ) {

            await supabaseClient.auth
                .signOut();


            message.textContent =
                "واجهة العامل سيتم تفعيلها لاحقًا.";

            message.style.color =
                "#1565c0";

            return;
        }


    }

    catch (error) {

        console.error(
            "خطأ غير متوقع:",
            error
        );


        message.textContent =
            "حدث خطأ غير متوقع: " +
            error.message;

        message.style.color =
            "red";

    }

}


/* =====================================================
   إعادة تعيين كلمة المرور
===================================================== */

async function resetPassword() {

    const email =
        document.getElementById(
            "username"
        ).value.trim();


    const message =
        document.getElementById(
            "message"
        );


    /* يجب إدخال البريد فقط */

    if (
        email === ""
    ) {

        message.textContent =
            "أدخل البريد الإلكتروني أولًا، ثم اضغط «نسيت كلمة المرور؟».";

        message.style.color =
            "red";

        return;
    }


    message.textContent =
        "جاري إرسال رابط إعادة تعيين كلمة المرور...";

    message.style.color =
        "#1565c0";


    try {


        /*
           رابط العودة بعد إعادة التعيين.

           نستخدم صفحة login.html نفسها
           حتى يستطيع المستخدم اختيار كلمة مرور جديدة.
        */

        const redirectUrl =
            window.location.origin +
            window.location.pathname;


        const {
            error
        } =
            await supabaseClient.auth
                .resetPasswordForEmail(

                    email,

                    {
                        redirectTo:
                            redirectUrl
                    }

                );


        /* في حالة الخطأ */

        if (error) {

            console.error(
                "خطأ إعادة تعيين كلمة المرور:",
                error
            );


            /*
               نعرض رسالة Supabase الحقيقية
               حتى نعرف سبب المشكلة.
            */

            message.textContent =
                "تعذر إرسال رابط إعادة التعيين: " +
                error.message;

            message.style.color =
                "red";

            return;
        }


        /* نجاح الإرسال */

        message.textContent =
            "تم إرسال رابط إعادة تعيين كلمة المرور إلى بريدك الإلكتروني. تحقق من البريد الوارد والبريد غير المرغوب فيه.";

        message.style.color =
            "green";


    }

    catch (error) {

        console.error(
            "خطأ غير متوقع:",
            error
        );


        message.textContent =
            "حدث خطأ أثناء إعادة التعيين: " +
            error.message;

        message.style.color =
            "red";

    }

}


</script>


</body>

</html>
