<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>تسجيل الدخول - منصة التكوين المتواصل</title>

    <style>

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f8;

            display: flex;
            justify-content: center;
            align-items: center;

            min-height: 100vh;
        }

        .login-box {
            background: white;
            width: 350px;
            max-width: calc(100% - 40px);

            padding: 30px;

            border-radius: 15px;

            box-shadow:
                0 4px 15px rgba(0,0,0,0.15);

            text-align: center;
        }

        .logo {
            font-size: 48px;
            margin-bottom: 10px;
        }

        h1 {
            color: #1565c0;
            font-size: 24px;
        }

        input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;

            box-sizing: border-box;

            border: 1px solid #ccc;
            border-radius: 8px;

            font-size: 15px;
        }

        button {
            width: 100%;

            padding: 13px;
            margin-top: 15px;

            border: none;
            border-radius: 8px;

            background: #1565c0;
            color: white;

            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #0d47a1;
        }

        .forgot {
            display: block;

            margin-top: 18px;

            color: #1565c0;

            cursor: pointer;

            text-decoration: underline;
        }

        #message {
            margin-top: 18px;

            font-weight: bold;

            line-height: 1.7;
        }

    </style>

</head>


<body>


<div class="login-box">


    <div class="logo">
        📚
    </div>


    <h1>
        منصة التكوين المتواصل
    </h1>


    <p>
        تسجيل الدخول
    </p>


    <input
        type="email"
        id="email"
        placeholder="البريد الإلكتروني"
        autocomplete="email"
    >


    <input
        type="password"
        id="password"
        placeholder="كلمة المرور"
        autocomplete="current-password"
    >


    <button
        type="button"
        onclick="login()"
    >
        🔐 تسجيل الدخول
    </button>


    <span
        class="forgot"
        onclick="resetPassword()"
    >
        نسيت كلمة المرور؟
    </span>


    <p id="message"></p>


</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="supabase-config.js"></script>


<script>


/* =====================================================
   تسجيل الدخول
===================================================== */

async function login() {

    const email =
        document.getElementById("email")
        .value
        .trim();


    const password =
        document.getElementById("password")
        .value;


    const message =
        document.getElementById("message");


    if (
        email === "" ||
        password === ""
    ) {

        message.textContent =
            "يرجى إدخال البريد الإلكتروني وكلمة المرور.";

        message.style.color = "red";

        return;
    }


    message.textContent =
        "جاري التحقق من بيانات الدخول...";

    message.style.color =
        "#1565c0";


    try {

        /* تسجيل الدخول إلى Supabase */

        const {
            data,
            error
        } =
        await supabaseClient.auth
            .signInWithPassword({

                email: email,

                password: password

            });


        if (error) {

            console.error(
                "خطأ تسجيل الدخول:",
                error
            );

            message.textContent =
                "فشل تسجيل الدخول: " +
                error.message;

            message.style.color =
                "red";

            return;
        }


        const user =
            data.user;


        if (!user) {

            message.textContent =
                "تعذر العثور على بيانات المستخدم.";

            message.style.color =
                "red";

            return;
        }


        /* =================================================
           البحث عن صلاحية المستخدم
        ================================================= */

        const {
            data: roleData,
            error: roleError
        } =
        await supabaseClient
            .from("user_roles")
            .select("role")
            .eq(
                "user_id",
                user.id
            )
            .maybeSingle();


        if (roleError) {

            console.error(
                "خطأ قراءة الصلاحية:",
                roleError
            );


            await supabaseClient.auth
                .signOut();


            message.textContent =
                "تعذر التحقق من صلاحيات الحساب.";

            message.style.color =
                "red";

            return;
        }


        /* =================================================
           المسؤول
        ================================================= */

        if (
            roleData &&
            roleData.role === "admin"
        ) {

            message.textContent =
                "مرحبًا بك، تم التعرف على حساب المسؤول ✅";

            message.style.color =
                "green";


            setTimeout(
                function() {

                    window.location.href =
                        "admin.html";

                },
                500
            );


            return;
        }


        /* =================================================
           المتربص
        ================================================= */

        if (
            roleData &&
            roleData.role === "trainee"
        ) {

            message.textContent =
                "تم تسجيل الدخول بنجاح ✅";

            message.style.color =
                "green";


            setTimeout(
                function() {

                    window.location.href =
                        "trainee.html";

                },
                500
            );


            return;
        }


        /* =================================================
           عامل أو مستخدم بدون صلاحية
        ================================================= */

        await supabaseClient.auth
            .signOut();


        message.textContent =
            "تم تسجيل الدخول، لكن لم يتم العثور على صلاحية لهذا الحساب.";

        message.style.color =
            "red";


    }

    catch (error) {

        console.error(
            "خطأ غير متوقع:",
            error
        );


        message.textContent =
            "حدث خطأ غير متوقع: " +
            error.message;

        message.style.color =
            "red";

    }

}


/* =====================================================
   إعادة تعيين كلمة المرور
===================================================== */

async function resetPassword() {

    const email =
        document.getElementById("email")
        .value
        .trim();


    const message =
        document.getElementById("message");


    if (email === "") {

        message.textContent =
            "أدخل البريد الإلكتروني أولًا.";

        message.style.color =
            "red";

        return;
    }


    message.textContent =
        "جاري إرسال رابط إعادة تعيين كلمة المرور...";

    message.style.color =
        "#1565c0";


    try {

        const redirectUrl =
            window.location.origin +
            window.location.pathname;


        const {
            error
        } =
        await supabaseClient.auth
            .resetPasswordForEmail(

                email,

                {
                    redirectTo:
                        redirectUrl
                }

            );


        if (error) {

            console.error(
                "خطأ إعادة التعيين:",
                error
            );


            message.textContent =
                "تعذر إرسال رابط إعادة التعيين: " +
                error.message;

            message.style.color =
                "red";

            return;
        }


        message.textContent =
            "تم إرسال رابط إعادة تعيين كلمة المرور إلى بريدك الإلكتروني.";

        message.style.color =
            "green";


    }

    catch (error) {

        console.error(
            "خطأ:",
            error
        );


        message.textContent =
            "حدث خطأ: " +
            error.message;

        message.style.color =
            "red";

    }

}


</script>


</body>

</html>
