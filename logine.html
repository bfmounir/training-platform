<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>تسجيل الدخول</title>

    <style>

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f8;
        }

        header {
            background: #1565c0;
            color: white;
            padding: 25px;
            text-align: center;
        }

        .container {
            max-width: 500px;
            margin: 40px auto;
            padding: 20px;
        }

        .box {
            background: white;
            padding: 25px;
            border-radius: 12px;
        }

        input {
            width: 100%;
            padding: 12px;
            margin: 8px 0 15px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 7px;
            font-size: 15px;
        }

        button {
            width: 100%;
            background: #1565c0;
            color: white;
            border: none;
            padding: 13px;
            border-radius: 7px;
            cursor: pointer;
            font-size: 16px;
        }

        #message {
            margin-top: 15px;
            text-align: center;
            font-weight: bold;
        }

    </style>

</head>

<body>

<header>

    <h1>🎓 منصة التكوين</h1>

    <p>تسجيل دخول المتربص</p>

</header>


<div class="container">

    <div class="box">

        <h2>🔐 تسجيل الدخول</h2>


        <label>البريد الإلكتروني</label>

        <input
            type="email"
            id="email"
            placeholder="أدخل البريد الإلكتروني"
        >


        <label>كلمة المرور</label>

        <input
            type="password"
            id="password"
            placeholder="أدخل كلمة المرور"
        >


        <button
            type="button"
            onclick="loginTrainee()"
        >
            🔑 تسجيل الدخول
        </button>


        <div id="message"></div>

    </div>

</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="supabase-config.js"></script>


<script>

async function loginTrainee() {

    const email =
        document.getElementById("email")
        .value
        .trim();

    const password =
        document.getElementById("password")
        .value;

    const message =
        document.getElementById("message");


    if (email === "" || password === "") {

        message.textContent =
            "يرجى إدخال البريد الإلكتروني وكلمة المرور";

        message.style.color = "red";

        return;
    }


    message.textContent =
        "جاري التحقق من بيانات الدخول...";

    message.style.color = "black";


    const {
        data,
        error
    } = await supabaseClient.auth.signInWithPassword({

        email: email ,

        password: password

    });


    if (error) {

        console.error(error);

        message.textContent =
            "فشل تسجيل الدخول: " + error.message;

        message.style.color = "red";

        return;
    }


    message.textContent =
        "تم تسجيل الدخول بنجاح ✅";

    message.style.color = "green";


    setTimeout(function() {

        window.location.href =
            "trainee.html";

    }, 1000);

}

</script>


</body>

</html>
