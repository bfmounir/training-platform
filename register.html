<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>تسجيل متربص جديد - منصة التكوين المتواصل</title>

<style>

/* =====================================================
   الإعدادات العامة
===================================================== */

* {
    box-sizing: border-box;
}

body {
    margin: 0;

    font-family: Tahoma, Arial, sans-serif;

    min-height: 100vh;

    background:
        radial-gradient(
            circle at 10% 20%,
            rgba(24,166,166,0.25),
            transparent 30%
        ),

        radial-gradient(
            circle at 90% 80%,
            rgba(13,110,253,0.25),
            transparent 30%
        ),

        linear-gradient(
            135deg,
            #062d5c,
            #0d6efd,
            #159f9f
        );

    display: flex;

    justify-content: center;

    align-items: center;

    padding: 25px;

    position: relative;

    overflow: hidden;
}


/* =====================================================
   الأشكال الخلفية
===================================================== */

body::before,
body::after {

    content: "";

    position: absolute;

    border-radius: 50%;

    background: rgba(255,255,255,0.08);

    pointer-events: none;
}

body::before {

    width: 330px;
    height: 330px;

    top: -120px;
    right: -100px;
}

body::after {

    width: 280px;
    height: 280px;

    bottom: -120px;
    left: -80px;
}


/* =====================================================
   زر الرئيسية
===================================================== */

.home-btn {

    position: absolute;

    top: 25px;
    right: 30px;

    text-decoration: none;

    color: white;

    background: rgba(255,255,255,0.14);

    border: 1px solid rgba(255,255,255,0.25);

    padding: 11px 18px;

    border-radius: 30px;

    font-size: 14px;

    backdrop-filter: blur(10px);

    transition: 0.3s;

    z-index: 5;
}

.home-btn:hover {

    background: rgba(255,255,255,0.25);

    transform: translateY(-2px);
}


/* =====================================================
   بطاقة التسجيل
===================================================== */

.register-box {

    position: relative;

    z-index: 2;

    width: 450px;

    max-width: 100%;

    padding: 35px 35px 30px;

    background: rgba(255,255,255,0.97);

    border-radius: 26px;

    box-shadow:
        0 25px 70px rgba(0,0,0,0.25);

    animation: appear 0.7s ease;
}


/* =====================================================
   حركة ظهور البطاقة
===================================================== */

@keyframes appear {

    from {

        opacity: 0;

        transform:
            translateY(25px)
            scale(0.97);
    }

    to {

        opacity: 1;

        transform:
            translateY(0)
            scale(1);
    }
}


/* =====================================================
   الشعار
===================================================== */

.logo-container {

    width: 95px;

    height: 95px;

    margin: 0 auto 16px;

    background: white;

    border-radius: 24px;

    display: flex;

    justify-content: center;

    align-items: center;

    border: 1px solid #edf1f5;

    box-shadow:
        0 8px 25px rgba(13,110,253,0.18);

    overflow: hidden;
}


.logo-container img {

    width: 75px;

    height: 75px;

    object-fit: contain;
}


/* =====================================================
   العنوان
===================================================== */

.title {

    text-align: center;

    margin: 0;

    color: #073b78;

    font-size: 25px;

    font-weight: 800;
}


.subtitle {

    text-align: center;

    color: #667085;

    font-size: 14px;

    margin:
        8px 0 25px;
}


/* =====================================================
   الحقول
===================================================== */

.field {

    margin-bottom: 17px;
}


.field label {

    display: block;

    margin-bottom: 7px;

    color: #344054;

    font-size: 14px;

    font-weight: bold;
}


.input-wrapper {

    position: relative;
}


.input-icon {

    position: absolute;

    right: 14px;

    top: 50%;

    transform: translateY(-50%);

    font-size: 18px;

    color: #0d6efd;

    pointer-events: none;
}


input {

    width: 100%;

    height: 52px;

    padding:
        0 45px 0 14px;

    border:
        1px solid #d9e2ec;

    border-radius: 13px;

    background: #f8fafc;

    color: #172b4d;

    font-size: 15px;

    outline: none;

    transition: 0.25s;
}


input::placeholder {

    color: #98a2b3;
}


input:focus {

    background: white;

    border-color: #0d6efd;

    box-shadow:
        0 0 0 4px
        rgba(13,110,253,0.10);
}


/* =====================================================
   ملاحظة كلمة المرور
===================================================== */

.password-note {

    margin-top: -8px;

    margin-bottom: 15px;

    color: #98a2b3;

    font-size: 12px;
}


/* =====================================================
   زر التسجيل
===================================================== */

.register-btn {

    width: 100%;

    height: 54px;

    margin-top: 5px;

    border: none;

    border-radius: 14px;

    background:
        linear-gradient(
            135deg,
            #073b78,
            #0d6efd,
            #159f9f
        );

    color: white;

    font-size: 16px;

    font-weight: bold;

    cursor: pointer;

    box-shadow:
        0 8px 20px
        rgba(13,110,253,0.25);

    transition: 0.3s;
}


.register-btn:hover {

    transform: translateY(-2px);

    box-shadow:
        0 12px 28px
        rgba(13,110,253,0.35);
}


.register-btn:active {

    transform: translateY(0);
}


/* =====================================================
   رابط تسجيل الدخول
===================================================== */

.login-link {

    display: block;

    text-align: center;

    margin-top: 18px;

    color: #0d6efd;

    font-size: 14px;

    text-decoration: none;

    font-weight: bold;

    transition: 0.2s;
}


.login-link:hover {

    color: #073b78;

    text-decoration: underline;
}


/* =====================================================
   الرسالة
===================================================== */

#message {

    min-height: 25px;

    margin-top: 17px;

    text-align: center;

    font-size: 14px;

    font-weight: bold;

    line-height: 1.7;
}


/* =====================================================
   معلومات المنصة
===================================================== */

.platform-info {

    margin-top: 23px;

    padding-top: 17px;

    border-top:
        1px solid #edf0f5;

    text-align: center;

    color: #98a2b3;

    font-size: 12px;

    line-height: 1.8;
}


/* =====================================================
   الهاتف
===================================================== */

@media (max-width: 600px) {

    body {

        padding: 20px;

    }


    .home-btn {

        top: 15px;

        right: 15px;

        padding: 9px 14px;

        font-size: 13px;

    }


    .register-box {

        padding:
            28px 22px 24px;

        border-radius: 22px;

    }


    .logo-container {

        width: 85px;

        height: 85px;

    }


    .logo-container img {

        width: 67px;

        height: 67px;

    }


    .title {

        font-size: 21px;

    }

}

</style>

</head>


<body>


<!-- =====================================================
     زر الرئيسية
===================================================== -->

<a
    href="index.html"
    class="home-btn"
>
    🏠 الرئيسية
</a>


<!-- =====================================================
     بطاقة التسجيل
===================================================== -->

<div class="register-box">


    <!-- الشعار -->

    <div class="logo-container">

        <img
            src="logo.png"
            alt="شعار منصة التكوين المتواصل"
        >

    </div>


    <!-- العنوان -->

    <h1 class="title">
        منصة التكوين المتواصل
    </h1>


    <p class="subtitle">
        إنشاء حساب متربص جديد
    </p>


    <!-- الاسم واللقب -->

    <div class="field">

        <label for="fullName">
            الاسم واللقب
        </label>

        <div class="input-wrapper">

            <span class="input-icon">
                👤
            </span>

            <input
                type="text"
                id="fullName"
                placeholder="أدخل الاسم واللقب"
                autocomplete="name"
            >

        </div>

    </div>


    <!-- البريد الإلكتروني -->

    <div class="field">

        <label for="email">
            البريد الإلكتروني
        </label>

        <div class="input-wrapper">

            <span class="input-icon">
                ✉️
            </span>

            <input
                type="email"
                id="email"
                placeholder="example@email.com"
                autocomplete="email"
            >

        </div>

    </div>


    <!-- كلمة المرور -->

    <div class="field">

        <label for="password">
            كلمة المرور
        </label>

        <div class="input-wrapper">

            <span class="input-icon">
                🔒
            </span>

            <input
                type="password"
                id="password"
                placeholder="أدخل كلمة المرور"
                autocomplete="new-password"
            >

        </div>

    </div>


    <div class="password-note">
        يجب أن تتكون كلمة المرور من 6 أحرف على الأقل.
    </div>


    <!-- زر التسجيل -->

    <button
        type="button"
        class="register-btn"
        onclick="registerTrainee()"
    >
        📝 إنشاء الحساب
    </button>


    <!-- الرسالة -->

    <div id="message"></div>


    <!-- تسجيل الدخول -->

    <a
        href="login.html"
        class="login-link"
    >
        لديك حساب بالفعل؟ تسجيل الدخول
    </a>


    <!-- معلومات المنصة -->

    <div class="platform-info">

        منصة التكوين المتواصل

        <br>

        المؤسسة العمومية الاستشفائية بأولف

    </div>


</div>


<!-- =====================================================
     Supabase
===================================================== -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="supabase-config.js"></script>


<script>

/* =====================================================
   تسجيل متربص جديد
===================================================== */

async function registerTrainee() {

    const fullName =
        document
        .getElementById("fullName")
        .value
        .trim();


    const email =
        document
        .getElementById("email")
        .value
        .trim();


    const password =
        document
        .getElementById("password")
        .value;


    const message =
        document
        .getElementById("message");


    /* التحقق من البيانات */

    if (
        fullName === "" ||
        email === "" ||
        password === ""
    ) {

        message.textContent =
            "يرجى ملء جميع المعلومات.";

        message.style.color =
            "#dc3545";

        return;
    }


    /* التحقق من طول كلمة المرور */

    if (password.length < 6) {

        message.textContent =
            "كلمة المرور يجب أن تكون 6 أحرف على الأقل.";

        message.style.color =
            "#dc3545";

        return;
    }


    message.textContent =
        "جاري إنشاء الحساب...";

    message.style.color =
        "#0d6efd";


    try {


        /* =================================================
           إنشاء حساب Supabase
        ================================================= */

        const {
            data,
            error
        } =
        await supabaseClient
            .auth
            .signUp({

                email: email,

                password: password

            });


        if (error) {

            console.error(error);


            message.textContent =
                "حدث خطأ: " +
                error.message;

            message.style.color =
                "#dc3545";

            return;
        }


        /* =================================================
           لم يتم إرجاع المستخدم
        ================================================= */

        if (!data.user) {

            message.textContent =
                "تم إنشاء الحساب، يرجى التحقق من البريد الإلكتروني.";

            message.style.color =
                "#198754";

            return;
        }


        /* =================================================
           حفظ بيانات المتربص
        ================================================= */

        const {
            error: traineeError
        } =
        await supabaseClient
            .from("trainees")
            .insert({

                id:
                    data.user.id,

                full_name:
                    fullName,

                email:
                    email

            });


        if (traineeError) {

            console.error(
                traineeError
            );


            message.textContent =
                "تم إنشاء الحساب، لكن حدث خطأ في حفظ بيانات المتربص.";

            message.style.color =
                "#dc3545";

            return;
        }


        /* =================================================
           نجاح التسجيل
        ================================================= */

        message.textContent =
            "تم التسجيل بنجاح ✅";

        message.style.color =
            "#198754";


        /* تفريغ الحقول */

        document
            .getElementById("fullName")
            .value = "";


        document
            .getElementById("email")
            .value = "";


        document
            .getElementById("password")
            .value = "";


    }

    catch (error) {

        console.error(error);


        message.textContent =
            "حدث خطأ غير متوقع: " +
            error.message;

        message.style.color =
            "#dc3545";

    }

}

</script>


</body>

</html>
