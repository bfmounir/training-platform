```html
<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>تسجيل متربص جديد - منصة التكوين المستمر</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, Tahoma, sans-serif;

    background:
        linear-gradient(
            135deg,
            #0f766e,
            #164e63
        );

    min-height: 100vh;

    display: flex;
    justify-content: center;
    align-items: center;

    padding: 20px;
}

.register-box {

    width: 100%;
    max-width: 520px;

    background: white;

    border-radius: 25px;

    padding: 32px;

    box-shadow:
        0 20px 50px rgba(0,0,0,.25);
}

.logo {

    width: 85px;
    height: 85px;

    margin: auto;

    border-radius: 50%;

    display: flex;

    align-items: center;
    justify-content: center;

    background: #ecfdf5;

    font-size: 42px;
}

h1 {

    text-align: center;

    color: #134e4a;

    margin:
        18px 0 8px;

    font-size: 24px;
}

.subtitle {

    text-align: center;

    color: #64748b;

    line-height: 1.8;

    margin-bottom: 25px;

    font-size: 14px;
}

.form-group {

    margin-bottom: 16px;
}

label {

    display: block;

    margin-bottom: 7px;

    color: #334155;

    font-weight: bold;

    font-size: 14px;
}

input {

    width: 100%;

    padding: 13px;

    border:
        1px solid #cbd5e1;

    border-radius: 12px;

    font-size: 15px;

    outline: none;

    background: white;
}

input:focus {

    border-color: #0f766e;

    box-shadow:
        0 0 0 3px rgba(15,118,110,.12);
}

button {

    width: 100%;

    padding: 15px;

    border: none;

    border-radius: 12px;

    background: #0f766e;

    color: white;

    font-size: 17px;

    font-weight: bold;

    cursor: pointer;

    margin-top: 5px;
}

button:hover {

    background: #115e59;
}

button:disabled {

    opacity: .6;

    cursor: not-allowed;
}

#message {

    margin-top: 18px;

    padding: 12px;

    border-radius: 10px;

    text-align: center;

    display: none;

    line-height: 1.7;

    font-size: 14px;
}

.error {

    background: #fee2e2;

    color: #991b1b;
}

.success {

    background: #dcfce7;

    color: #166534;
}

.info {

    background: #e0f2fe;

    color: #075985;
}

.back-login {

    display: block;

    text-align: center;

    margin-top: 20px;

    color: #0f766e;

    text-decoration: none;

    font-weight: bold;

    font-size: 14px;
}

.back-login:hover {

    text-decoration: underline;
}

.footer {

    text-align: center;

    margin-top: 22px;

    color: #64748b;

    font-size: 12px;

    line-height: 1.8;
}

</style>

</head>


<body>


<div class="register-box">


    <div class="logo">
        🎓
    </div>


    <h1>
        إنشاء حساب متربص
    </h1>


    <div class="subtitle">

        منصة التكوين المستمر<br>

        المؤسسة العمومية الإستشفائية بأولف<br>

        ولاية أدرار

    </div>


    <form id="registerForm">


        <div class="form-group">

            <label for="fullName">
                الاسم واللقب
            </label>

            <input
                type="text"
                id="fullName"
                placeholder="أدخل الاسم واللقب"
                required
                autocomplete="name"
            >

        </div>


        <div class="form-group">

            <label for="email">
                البريد الإلكتروني
            </label>

            <input
                type="email"
                id="email"
                placeholder="أدخل البريد الإلكتروني"
                required
                autocomplete="email"
            >

        </div>


        <div class="form-group">

            <label for="phone">
                رقم الهاتف
            </label>

            <input
                type="tel"
                id="phone"
                placeholder="أدخل رقم الهاتف"
                autocomplete="tel"
            >

        </div>


        <div class="form-group">

            <label for="position">
                الرتبة / الصفة
            </label>

            <input
                type="text"
                id="position"
                placeholder="مثال: مساعد تمريض"
            >

        </div>


        <div class="form-group">

            <label for="department">
                المصلحة
            </label>

            <input
                type="text"
                id="department"
                placeholder="أدخل المصلحة"
            >

        </div>


        <div class="form-group">

            <label for="password">
                كلمة المرور
            </label>

            <input
                type="password"
                id="password"
                placeholder="6 أحرف على الأقل"
                required
                minlength="6"
                autocomplete="new-password"
            >

        </div>


        <div class="form-group">

            <label for="confirmPassword">
                تأكيد كلمة المرور
            </label>

            <input
                type="password"
                id="confirmPassword"
                placeholder="أعد كتابة كلمة المرور"
                required
                minlength="6"
                autocomplete="new-password"
            >

        </div>


        <button
            id="registerButton"
            type="submit">

            إنشاء حساب

        </button>


    </form>


    <div id="message"></div>


    <a
        href="login.html"
        class="back-login">

        ← العودة إلى تسجيل الدخول

    </a>


    <div class="footer">

        مكتب التكوين المتواصل<br>

        المؤسسة العمومية الإستشفائية بأولف

    </div>


</div>



<script>


const registerForm =
    document.getElementById("registerForm");

const registerButton =
    document.getElementById("registerButton");

const message =
    document.getElementById("message");


function showMessage(text, type) {

    message.textContent = text;

    message.className = type;

    message.style.display = "block";
}


registerForm.addEventListener(
    "submit",
    async function(event) {

        event.preventDefault();


        const fullName =
            document
                .getElementById("fullName")
                .value
                .trim();


        const email =
            document
                .getElementById("email")
                .value
                .trim();


        const phone =
            document
                .getElementById("phone")
                .value
                .trim();


        const position =
            document
                .getElementById("position")
                .value
                .trim();


        const department =
            document
                .getElementById("department")
                .value
                .trim();


        const password =
            document
                .getElementById("password")
                .value;


        const confirmPassword =
            document
                .getElementById("confirmPassword")
                .value;


        if (password !== confirmPassword) {

            showMessage(
                "كلمتا المرور غير متطابقتين.",
                "error"
            );

            return;
        }


        if (password.length < 6) {

            showMessage(
                "يجب أن تتكون كلمة المرور من 6 أحرف على الأقل.",
                "error"
            );

            return;
        }


        registerButton.disabled = true;

        registerButton.textContent =
            "جارٍ إنشاء الحساب...";

        message.style.display = "none";


        try {


            /*
             * إنشاء الحساب في Supabase Auth.
             *
             * لا نعطي المستخدم صلاحية trainee هنا.
             * الموافقة والصلاحية ستتم لاحقًا من طرف المسؤول.
             */

            const { data, error } =
                await supabaseClient.auth.signUp({

                    email: email,

                    password: password,

                    options: {

                        data: {

                            full_name: fullName,

                            phone: phone,

                            position: position,

                            department: department

                        }

                    }

                });


            if (error) {

                throw new Error(
                    error.message
                );
            }


            if (!data || !data.user) {

                throw new Error(
                    "تعذر إنشاء الحساب."
                );
            }


            /*
             * في بعض إعدادات Supabase يكون
             * تأكيد البريد الإلكتروني مفعلاً.
             */

            if (
                data.user.identities &&
                data.user.identities.length === 0
            ) {

                throw new Error(
                    "هذا البريد الإلكتروني مسجل مسبقًا."
                );
            }


            showMessage(

                "تم إرسال طلب إنشاء الحساب بنجاح. " +
                "يرجى انتظار مراجعة وموافقة المسؤول " +
                "قبل استعمال المنصة.",

                "success"

            );


            registerForm.reset();


            registerButton.textContent =
                "تم إرسال الطلب";


        } catch (error) {


            console.error(error);


            let errorMessage =
                error.message ||
                "حدث خطأ أثناء إنشاء الحساب.";


            /*
             * رسائل مبسطة للمستخدم
             */

            if (
                errorMessage
                    .toLowerCase()
                    .includes("already registered")
            ) {

                errorMessage =
                    "هذا البريد الإلكتروني مسجل مسبقًا.";

            }


            showMessage(
                errorMessage,
                "error"
            );


            registerButton.disabled = false;

            registerButton.textContent =
                "إنشاء حساب";

        }

    }
);

</script>


</body>

</html>
```
