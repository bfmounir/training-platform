<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>منصة التكوين المتواصل</title>

<style>

/* =========================
   الإعدادات العامة
========================= */

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, Tahoma, sans-serif;
    background: #f4f7fb;
    color: #263238;
}

button,
a,
input,
textarea,
select {
    font-family: inherit;
}


/* =========================
   الرأس
========================= */

header {
    background: linear-gradient(
        135deg,
        #1565c0,
        #0d47a1
    );

    color: white;

    padding: 30px 20px;

    text-align: center;

    box-shadow:
        0 4px 15px rgba(0,0,0,0.12);
}

header h1 {
    margin: 0 0 10px;

    font-size: 30px;
}

header p {
    margin: 0;

    opacity: 0.95;

    font-size: 16px;
}


/* =========================
   الحاوية
========================= */

.container {

    width: 100%;

    max-width: 1100px;

    margin: auto;

    padding: 25px 18px 50px;
}


/* =========================
   بطاقة الترحيب
========================= */

.welcome {

    background: white;

    border-radius: 18px;

    padding: 25px;

    margin-bottom: 25px;

    box-shadow:
        0 4px 18px rgba(0,0,0,0.07);

    border-right: 5px solid #1565c0;
}

.welcome h2 {

    margin-top: 0;

    color: #1565c0;

    font-size: 24px;
}

.welcome p {

    margin-bottom: 0;

    color: #546e7a;

    line-height: 1.8;
}


/* =========================
   شريط الأقسام
========================= */

.nav-menu {

    display: flex;

    gap: 10px;

    flex-wrap: wrap;

    margin-bottom: 25px;
}

.nav-button {

    border: none;

    background: white;

    color: #1565c0;

    padding: 11px 18px;

    border-radius: 10px;

    cursor: pointer;

    font-size: 15px;

    box-shadow:
        0 2px 8px rgba(0,0,0,0.06);
}

.nav-button:hover {

    background: #1565c0;

    color: white;
}


/* =========================
   الرسائل
========================= */

#message {

    text-align: center;

    padding: 18px;

    margin-bottom: 20px;

    font-weight: bold;

    color: #546e7a;
}


/* =========================
   بطاقة الدورة
========================= */

.course {

    background: white;

    border-radius: 18px;

    padding: 25px;

    margin-bottom: 25px;

    box-shadow:
        0 4px 18px rgba(0,0,0,0.07);

    border: 1px solid #e8eef5;
}

.course-header {

    display: flex;

    justify-content: space-between;

    align-items: center;

    gap: 15px;

    flex-wrap: wrap;
}

.course h2 {

    color: #1565c0;

    margin: 0;

    font-size: 23px;
}

.course-description {

    color: #607d8b;

    line-height: 1.8;

    margin: 15px 0;
}


/* =========================
   حالة التسجيل
========================= */

.status {

    display: inline-block;

    padding: 8px 13px;

    border-radius: 20px;

    font-size: 14px;

    font-weight: bold;
}

.status-enrolled {

    background: #e8f5e9;

    color: #2e7d32;
}

.status-not-enrolled {

    background: #fff3e0;

    color: #ef6c00;
}


/* =========================
   أزرار
========================= */

.btn {

    display: inline-block;

    border: none;

    text-decoration: none;

    padding: 11px 17px;

    border-radius: 9px;

    cursor: pointer;

    font-size: 15px;

    margin-top: 10px;

    transition: 0.2s;
}

.btn:hover {

    transform: translateY(-1px);

    opacity: 0.92;
}

.btn-primary {

    background: #1565c0;

    color: white;
}

.btn-success {

    background: #2e7d32;

    color: white;
}

.btn-purple {

    background: #6a1b9a;

    color: white;
}

.btn-gray {

    background: #78909c;

    color: white;
}

.btn:disabled {

    cursor: default;

    opacity: 0.7;

    transform: none;
}


/* =========================
   شريط التقدم
========================= */

.progress-area {

    margin-top: 20px;

    background: #f8fafc;

    padding: 15px;

    border-radius: 12px;
}

.progress-info {

    display: flex;

    justify-content: space-between;

    gap: 10px;

    margin-bottom: 9px;

    font-weight: bold;

    font-size: 14px;
}

.progress {

    background: #e5e7eb;

    border-radius: 20px;

    height: 18px;

    overflow: hidden;
}

.progress-bar {

    background: linear-gradient(
        90deg,
        #2e7d32,
        #43a047
    );

    height: 100%;

    width: 0%;

    border-radius: 20px;

    transition: width 0.5s ease;
}


/* =========================
   الدروس
========================= */

.lessons-title {

    margin-top: 25px;

    margin-bottom: 12px;

    color: #37474f;

    font-size: 20px;
}

.lesson {

    background: #f8fafc;

    border: 1px solid #e7edf3;

    padding: 18px;

    margin-top: 12px;

    border-radius: 13px;
}

.lesson h3 {

    margin-top: 0;

    color: #37474f;

    font-size: 18px;
}

.lesson-content {

    color: #546e7a;

    line-height: 1.9;

    white-space: pre-line;
}

.lesson-actions {

    display: flex;

    gap: 8px;

    flex-wrap: wrap;
}


/* =========================
   زر PDF
========================= */

.pdf-button {

    display: inline-block;

    background: #1565c0;

    color: white;

    text-decoration: none;

    padding: 10px 15px;

    border-radius: 8px;

    margin-top: 10px;
}


/* =========================
   الدرس المكتمل
========================= */

.completed {

    background: #78909c !important;

    color: white !important;

    cursor: default !important;
}


/* =========================
   انتهاء الدورة
========================= */

.finished {

    background: #fff8e1;

    color: #8d6e00;

    padding: 15px;

    border-radius: 10px;

    margin-top: 18px;

    font-weight: bold;

    text-align: center;
}


/* =========================
   الشهادات
========================= */

#certificateArea {

    margin-top: 30px;
}

.certificates-title {

    background: linear-gradient(
        135deg,
        #6a1b9a,
        #8e24aa
    );

    color: white;

    padding: 22px;

    border-radius: 16px;

    margin-bottom: 15px;
}

.certificate-box {

    background: white;

    border-radius: 15px;

    padding: 20px;

    margin-bottom: 15px;

    box-shadow:
        0 3px 14px rgba(0,0,0,0.07);
}

.certificate-box h3 {

    color: #6a1b9a;

    margin-top: 0;
}


/* =========================
   لا توجد بيانات
========================= */

.empty {

    background: white;

    text-align: center;

    padding: 30px;

    border-radius: 15px;

    color: #78909c;
}


/* =========================
   قالب الشهادة
========================= */

#certificateTemplate {

    position: absolute;

    left: -10000px;

    top: 0;

    width: 1123px;

    height: 794px;

    background: white;

    padding: 50px;

    text-align: center;

    font-family: Arial, sans-serif;

    direction: rtl;
}

.certificate-border {

    width: 100%;

    height: 100%;

    border: 8px double #1565c0;

    padding: 45px;
}

.certificate-title {

    font-size: 42px;

    font-weight: bold;

    color: #1565c0;

    margin: 20px 0;
}

.certificate-subtitle {

    font-size: 24px;

    margin: 15px 0;
}

.certificate-name {

    font-size: 38px;

    font-weight: bold;

    margin: 25px 0;
}

.certificate-course {

    font-size: 28px;

    font-weight: bold;

    color: #333;

    margin: 20px 0;
}

.certificate-number {

    font-size: 18px;

    margin-top: 25px;
}

#qrCode {

    margin-top: 15px;
}


/* =========================
   الهاتف
========================= */

@media (max-width: 700px) {

    header {

        padding: 22px 15px;
    }

    header h1 {

        font-size: 24px;
    }

    .container {

        padding: 15px 12px 35px;
    }

    .welcome,
    .course {

        padding: 18px;
    }

    .course-header {

        align-items: flex-start;

        flex-direction: column;
    }

    .course h2 {

        font-size: 20px;
    }

    .lesson {

        padding: 15px;
    }

    .btn,
    .pdf-button {

        width: 100%;

        text-align: center;
    }

}


/* =========================
   شاشة التحميل
========================= */

.loading {

    background: white;

    padding: 35px;

    border-radius: 15px;

    text-align: center;

    color: #607d8b;
}

</style>

</head>


<body>


<header>

    <h1>
        🎓 منصة التكوين المتواصل
    </h1>

    <p>
        المؤسسة العمومية الاستشفائية بأولف
    </p>

</header>


<div class="container">


    <!-- الترحيب -->

    <div class="welcome">

        <h2 id="welcomeTitle">
            👋 مرحبًا بك
        </h2>

        <p id="welcomeText">
            جاري تحميل بيانات حسابك...
        </p>

    </div>


    <!-- القائمة -->

    <div class="nav-menu">

        <button
            class="nav-button"
            onclick="scrollToCourses()"
        >
            📚 الدورات
        </button>

        <button
            class="nav-button"
            onclick="scrollToCertificates()"
        >
            🏆 شهاداتي
        </button>

        <button
            class="nav-button"
            onclick="logout()"
        >
            🚪 تسجيل الخروج
        </button>

    </div>


    <div id="message">
        جاري تحميل الدورات...
    </div>


    <div id="coursesList"></div>


    <div id="certificateArea"></div>


</div>


<!-- =========================
     قالب الشهادة
========================= -->

<div id="certificateTemplate">

    <div class="certificate-border">

        <div style="font-size:22px;font-weight:bold;">
            الجمهورية الجزائرية الديمقراطية الشعبية
        </div>

        <div style="font-size:20px;margin-top:10px;">
            وزارة الصحة
        </div>

        <div style="font-size:19px;margin-top:8px;">
            المؤسسة العمومية الاستشفائية بأولف
        </div>

        <div class="certificate-title">
            شهادة إتمام تكوين
        </div>

        <div class="certificate-subtitle">
            تشهد المؤسسة بأن المتربص:
        </div>

        <div
            id="certificateTraineeName"
            class="certificate-name"
        ></div>

        <div class="certificate-subtitle">
            قد أتم بنجاح التكوين في:
        </div>

        <div
            id="certificateCourseName"
            class="certificate-course"
        ></div>

        <div
            id="certificateDate"
            style="font-size:20px;margin-top:20px;"
        ></div>

        <div
            id="certificateNumber"
            class="certificate-number"
        ></div>

        <div id="qrCode"></div>

    </div>

</div>


<!-- =========================
     المكتبات
========================= -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="supabase-config.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>


<script>

let currentUser = null;


/* =========================
   المستخدم الحالي
========================= */

async function getCurrentUser() {

    const {
        data,
        error
    } = await supabaseClient.auth.getUser();

    if (error || !data || !data.user) {

        console.error(
            "خطأ المستخدم:",
            error
        );

        return null;
    }

    return data.user;
}


/* =========================
   تسجيل الخروج
========================= */

async function logout() {

    const {
        error
    } = await supabaseClient.auth.signOut();

    if (error) {

        alert(
            "تعذر تسجيل الخروج."
        );

        return;
    }

    window.location.href =
        "login.html";
}


/* =========================
   التحقق من التسجيل
========================= */

async function isEnrolled(courseId) {

    if (!currentUser) {

        return false;
    }

    const {
        data,
        error
    } = await supabaseClient
        .from("enrollments")
        .select("id")
        .eq(
            "trainee_id",
            currentUser.id
        )
        .eq(
            "course_id",
            courseId
        )
        .maybeSingle();

    if (error) {

        console.error(
            "خطأ التحقق من التسجيل:",
            error
        );

        return false;
    }

    return !!data;
}


/* =========================
   تحميل التقدم
========================= */

async function getProgress(lessonIds) {

    if (
        !lessonIds ||
        lessonIds.length === 0
    ) {

        return [];
    }

    const {
        data,
        error
    } = await supabaseClient
        .from("lesson_progress")
        .select("lesson_id")
        .eq(
            "trainee_id",
            currentUser.id
        )
        .in(
            "lesson_id",
            lessonIds
        );

    if (error) {

        console.error(
            "خطأ تحميل التقدم:",
            error
        );

        return [];
    }

    return data || [];
}


/* =========================
   إكمال الدرس
========================= */

async function completeLesson(
    lessonId,
    button,
    courseId
) {

    if (!currentUser) {

        alert(
            "يجب تسجيل الدخول أولًا."
        );

        return;
    }

    button.disabled = true;

    button.textContent =
        "جاري الحفظ...";


    const {
        error
    } = await supabaseClient
        .from("lesson_progress")
        .insert({

            trainee_id:
                currentUser.id,

            lesson_id:
                lessonId

        });


    if (error) {

        console.error(
            "خطأ إكمال الدرس:",
            error
        );


        if (
            error.code === "23505"
        ) {

            button.textContent =
                "✅ تم إكمال الدرس";

            button.classList.add(
                "completed"
            );

            button.disabled =
                true;

        } else {

            alert(
                "حدث خطأ أثناء حفظ التقدم."
            );

            button.disabled =
                false;

            button.textContent =
                "☑️ تم إكمال الدرس";
        }

        return;
    }


    button.textContent =
        "✅ تم إكمال الدرس";

    button.classList.add(
        "completed"
    );


    await updateCourseProgress(
        courseId
    );

}


/* =========================
   تحديث تقدم الدورة
========================= */

async function updateCourseProgress(
    courseId
) {

    const {
        data: lessons,
        error
    } = await supabaseClient
        .from("lessons")
        .select("id")
        .eq(
            "course_id",
            courseId
        );


    if (
        error ||
        !lessons
    ) {

        return;
    }


    const lessonIds =
        lessons.map(
            lesson =>
                lesson.id
        );


    const progress =
        await getProgress(
            lessonIds
        );


    const total =
        lessonIds.length;


    const completed =
        progress.length;


    const percentage =
        total === 0
            ? 0
            : Math.round(
                completed /
                total *
                100
            );


    const progressBar =
        document.getElementById(
            "progress-" +
            courseId
        );


    const progressText =
        document.getElementById(
            "progress-text-" +
            courseId
        );


    if (progressBar) {

        progressBar.style.width =
            percentage + "%";
    }


    if (progressText) {

        progressText.textContent =
            "📊 " +
            completed +
            " من " +
            total +
            " دروس — " +
            percentage +
            "%";
    }


    const finished =
        document.getElementById(
            "finished-" +
            courseId
        );


    if (
        finished &&
        total > 0 &&
        completed === total
    ) {

        finished.style.display =
            "block";

        finished.textContent =
            "🏆 أحسنت! لقد أكملت جميع دروس هذه الدورة.";
    }

}


/* =========================
   التسجيل في الدورة
========================= */

async function enrollInCourse(
    courseId,
    button
) {

    if (!currentUser) {

        window.location.href =
            "login.html";

        return;
    }


    if (button) {

        button.disabled =
            true;

        button.textContent =
            "جاري التسجيل...";
    }


    const {
        error
    } = await supabaseClient
        .from("enrollments")
        .insert({

            trainee_id:
                currentUser.id,

            course_id:
                courseId

        });


    if (error) {

        console.error(
            "خطأ التسجيل:",
            error
        );


        if (
            error.code === "23505"
        ) {

            alert(
                "أنت مسجل بالفعل في هذه الدورة ✅"
            );

        } else {

            alert(
                "حدث خطأ أثناء التسجيل في الدورة."
            );

        }


        if (button) {

            button.disabled =
                false;

            button.textContent =
                "📝 التسجيل في الدورة";
        }

        return;
    }


    alert(
        "تم التسجيل في الدورة بنجاح ✅"
    );


    await loadCourses();

}


/* =========================
   تحميل الدروس
========================= */

async function loadLessons(
    courseId,
    container,
    enrolled
) {

    if (!enrolled) {

        container.innerHTML = `

            <div class="empty">

                🔐 سجل في الدورة أولًا
                للوصول إلى الدروس.

            </div>

        `;

        return;
    }


    const {
        data: lessons,
        error
    } = await supabaseClient
        .from("lessons")
        .select(
            "id, title, content, pdf_url"
        )
        .eq(
            "course_id",
            courseId
        )
        .order(
            "title",
            {
                ascending:
                    true
            }
        );


    if (error) {

        console.error(
            "خطأ تحميل الدروس:",
            error
        );


        container.innerHTML = `

            <div class="empty">

                ❌ تعذر تحميل الدروس.

            </div>

        `;

        return;
    }


    if (
        !lessons ||
        lessons.length === 0
    ) {

        container.innerHTML = `

            <div class="empty">

                📖 لا توجد دروس لهذه الدورة حاليًا.

            </div>

        `;

        await updateCourseProgress(
            courseId
        );

        return;
    }


    const lessonIds =
        lessons.map(
            lesson =>
                lesson.id
        );


    const progress =
        await getProgress(
            lessonIds
        );


    const completedIds =
        progress.map(
            item =>
                item.lesson_id
        );


    container.innerHTML = "";


    lessons.forEach(
        function(lesson, index) {

            const lessonBox =
                document.createElement(
                    "div"
                );


            lessonBox.className =
                "lesson";


            const title =
                document.createElement(
                    "h3"
                );


            title.textContent =
                "📖 الدرس " +
                (index + 1) +
                ": " +
                lesson.title;


            lessonBox.appendChild(
                title
            );


            const content =
                document.createElement(
                    "div"
                );


            content.className =
                "lesson-content";


            content.textContent =
                lesson.content ||
                "لا يوجد محتوى لهذا الدرس.";


            lessonBox.appendChild(
                content
            );


            const actions =
                document.createElement(
                    "div"
                );


            actions.className =
                "lesson-actions";


            if (
                lesson.pdf_url
            ) {

                const pdf =
                    document.createElement(
                        "a"
                    );


                pdf.href =
                    lesson.pdf_url;


                pdf.target =
                    "_blank";


                pdf.rel =
                    "noopener noreferrer";


                pdf.className =
                    "pdf-button";


                pdf.textContent =
                    "📄 فتح ملف PDF";


                actions.appendChild(
                    pdf
                );

            }


            const complete =
                document.createElement(
                    "button"
                );


            complete.className =
                "btn btn-success";


            if (
                completedIds.includes(
                    lesson.id
                )
            ) {

                complete.textContent =
                    "✅ تم إكمال الدرس";

                complete.classList.add(
                    "completed"
                );

                complete.disabled =
                    true;

            } else {

                complete.textContent =
                    "☑️ تم إكمال الدرس";

                complete.onclick =
                    function() {

                        completeLesson(
                            lesson.id,
                            complete,
                            courseId
                        );

                    };

            }


            actions.appendChild(
                complete
            );


            lessonBox.appendChild(
                actions
            );


            container.appendChild(
                lessonBox
            );

        }
    );


    await updateCourseProgress(
        courseId
    );

}


/* =========================
   تحميل الدورات
========================= */

async function loadCourses() {

    const message =
        document.getElementById(
            "message"
        );


    const list =
        document.getElementById(
            "coursesList"
        );


    list.innerHTML = "";


    message.textContent =
        "⏳ جاري تحميل الدورات...";


    currentUser =
        await getCurrentUser();


    if (!currentUser) {

        message.textContent =
            "⛔ يجب تسجيل الدخول أولًا.";

        setTimeout(
            function() {

                window.location.href =
                    "login.html";

            },
            1000
        );

        return;
    }


    /* بيانات المتربص */

    const {
        data: trainee
    } =
    await supabaseClient
        .from("trainees")
        .select(
            "full_name"
        )
        .eq(
            "id",
            currentUser.id
        )
        .maybeSingle();


    const name =
        trainee?.full_name ||
        currentUser.email ||
        "المتربص";


    document.getElementById(
        "welcomeTitle"
    ).textContent =
        "👋 مرحبًا " +
        name;


    document.getElementById(
        "welcomeText"
    ).textContent =
        "يمكنك الاطلاع على الدورات المسجل فيها، متابعة دروسك، ومعرفة نسبة تقدمك والحصول على شهاداتك.";


    const {
        data: courses,
        error
    } =
    await supabaseClient
        .from("courses")
        .select(
            "id, name, description"
        )
        .order(
            "name",
            {
                ascending:
                    true
            }
        );


    if (error) {

        console.error(
            "خطأ تحميل الدورات:",
            error
        );


        message.textContent =
            "❌ حدث خطأ أثناء تحميل الدورات.";

        return;
    }


    if (
        !courses ||
        courses.length === 0
    ) {

        message.textContent =
            "📚 لا توجد دورات متاحة حاليًا.";

        return;
    }


    message.textContent =
        "📚 الدورات التكوينية";


    for (
        const course of courses
    ) {

        const courseBox =
            document.createElement(
                "div"
            );


        courseBox.className =
            "course";


        const enrolled =
            await isEnrolled(
                course.id
            );


        courseBox.innerHTML = `

            <div class="course-header">

                <h2>
                    📚 ${escapeHtml(course.name)}
                </h2>

                <span class="status ${
                    enrolled
                    ? "status-enrolled"
                    : "status-not-enrolled"
                }">

                    ${
                        enrolled
                        ? "✅ مسجل"
                        : "📝 غير مسجل"
                    }

                </span>

            </div>

            <div class="course-description">

                ${
                    escapeHtml(
                        course.description ||
                        "لا يوجد وصف للدورة."
                    )
                }

            </div>

        `;


        if (!enrolled) {

            const enrollButton =
                document.createElement(
                    "button"
                );


            enrollButton.className =
                "btn btn-success";


            enrollButton.textContent =
                "📝 التسجيل في الدورة";


            enrollButton.onclick =
                function() {

                    enrollInCourse(
                        course.id,
                        enrollButton
                    );

                };


            courseBox.appendChild(
                enrollButton
            );

        }


        const progressArea =
            document.createElement(
                "div"
            );


        progressArea.className =
            "progress-area";


        progressArea.innerHTML = `

            <div class="progress-info">

                <span>
                    📊 تقدم الدورة
                </span>

                <span
                    id="progress-text-${course.id}"
                >
                    جاري الحساب...
                </span>

            </div>

            <div class="progress">

                <div
                    class="progress-bar"
                    id="progress-${course.id}"
                ></div>

            </div>

        `;


        courseBox.appendChild(
            progressArea
        );


        const finished =
            document.createElement(
                "div"
            );


        finished.id =
            "finished-" +
            course.id;


        finished.className =
            "finished";


        finished.style.display =
            "none";


        courseBox.appendChild(
            finished
        );


        if (enrolled) {

            const lessonsTitle =
                document.createElement(
                    "div"
                );


            lessonsTitle.className =
                "lessons-title";


            lessonsTitle.textContent =
                "📖 دروس الدورة";


            courseBox.appendChild(
                lessonsTitle
            );

        }


        const lessonsBox =
            document.createElement(
                "div"
            );


        lessonsBox.innerHTML = `

            <div class="loading">
                ⏳ جاري تحميل الدروس...
            </div>

        `;


        courseBox.appendChild(
            lessonsBox
        );


        list.appendChild(
            courseBox
        );


        await loadLessons(
            course.id,
            lessonsBox,
            enrolled
        );

    }


    await loadMyCertificates();

}


/* =========================
   الشهادات
========================= */

async function loadMyCertificates() {

    const area =
        document.getElementById(
            "certificateArea"
        );


    area.innerHTML = "";


    if (!currentUser) {

        return;
    }


    const {
        data,
        error
    } =
        await supabaseClient
            .from("certificates")
            .select(`
                id,
                course_id,
                certificate_number,
                issue_date,
                pdf_url,
                trainee_id
            `)
            .eq(
                "trainee_id",
                currentUser.id
            )
            .order(
                "issue_date",
                {
                    ascending:
                        false
                }
            );


    if (error) {

        console.error(
            "خطأ تحميل الشهادات:",
            error
        );

        return;
    }


    const title =
        document.createElement(
            "div"
        );


    title.className =
        "certificates-title";


    title.innerHTML = `

        <h2>
            🏆 شهاداتي
        </h2>

        <p>
            الشهادات التي حصلت عليها بعد إتمام الدورات.
        </p>

    `;


    area.appendChild(
        title
    );


    if (
        !data ||
        data.length === 0
    ) {

        const empty =
            document.createElement(
                "div"
            );


        empty.className =
            "empty";


        empty.textContent =
            "🎓 لا توجد شهادات متاحة حاليًا.";


        area.appendChild(
            empty
        );


        return;
    }


    for (
        const certificate of data
    ) {

        const box =
            document.createElement(
                "div"
            );


        box.className =
            "certificate-box";


        let courseName =
            "الدورة التكوينية";


        const {
            data: course
        } =
            await supabaseClient
                .from("courses")
                .select(
                    "name"
                )
                .eq(
                    "id",
                    certificate.course_id
                )
                .maybeSingle();


        if (course) {

            courseName =
                course.name;

        }


        box.innerHTML = `

            <h3>
                🏆 شهادة إتمام التكوين
            </h3>

            <p>
                <strong>الدورة:</strong>
                ${escapeHtml(courseName)}
            </p>

            <p>
                <strong>رقم الشهادة:</strong>
                ${escapeHtml(
                    certificate.certificate_number
                )}
            </p>

            <p>
                <strong>تاريخ الإصدار:</strong>
                ${escapeHtml(
                    certificate.issue_date
                )}
            </p>

        `;


        if (
            certificate.pdf_url
        ) {

            const link =
                document.createElement(
                    "a"
                );


            link.href =
                certificate.pdf_url;


            link.target =
                "_blank";


            link.rel =
                "noopener noreferrer";


            link.className =
                "btn btn-purple";


            link.textContent =
                "📄 عرض الشهادة";


            box.appendChild(
                link
            );

        }


        area.appendChild(
            box
        );

    }

}


/* =========================
   حماية HTML
========================= */

function escapeHtml(value) {

    if (
        value === null ||
        value === undefined
    ) {

        return "";

    }


    return String(value)
        .replace(
            /&/g,
            "&amp;"
        )
        .replace(
            /</g,
            "&lt;"
        )
        .replace(
            />/g,
            "&gt;"
        )
        .replace(
            /"/g,
            "&quot;"
        )
        .replace(
            /'/g,
            "&#039;"
        );

}


/* =========================
   التنقل
========================= */

function scrollToCourses() {

    document.getElementById(
        "coursesList"
    ).scrollIntoView({
        behavior:
            "smooth"
    });

}


function scrollToCertificates() {

    document.getElementById(
        "certificateArea"
    ).scrollIntoView({
        behavior:
            "smooth"
    });

}


/* =========================
   تشغيل الصفحة
========================= */

loadCourses();

</script>
