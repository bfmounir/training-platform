<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>منصة التكوين</title>

<style>

/* =========================
   الإعدادات العامة
========================= */

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Tahoma, Arial, sans-serif;
    background: #f5f7fb;
    color: #263238;
}


/* =========================
   الشريط العلوي
========================= */

header {
    background: linear-gradient(135deg, #0d47a1, #1976d2, #42a5f5);
    color: white;
    padding: 35px 20px;
    text-align: center;
    box-shadow: 0 5px 20px rgba(0,0,0,0.12);
}

.logo {
    font-size: 55px;
    margin-bottom: 8px;
}

header h1 {
    margin: 0;
    font-size: 32px;
}

header p {
    margin-top: 10px;
    font-size: 17px;
    opacity: 0.95;
}


/* =========================
   الحاوية
========================= */

.container {
    max-width: 1100px;
    margin: 30px auto;
    padding: 0 18px;
}


/* =========================
   رسالة التحميل
========================= */

#message {
    background: white;
    border-radius: 18px;
    padding: 20px;
    text-align: center;
    margin-bottom: 25px;
    box-shadow: 0 5px 18px rgba(0,0,0,0.06);
    font-weight: bold;
}


/* =========================
   بطاقة الدورة
========================= */

.course {
    background: white;
    padding: 25px;
    margin-bottom: 25px;
    border-radius: 20px;
    border: 1px solid #e6eaf0;
    box-shadow: 0 8px 25px rgba(0,0,0,0.07);
    transition: 0.25s;
}

.course:hover {
    transform: translateY(-3px);
    box-shadow: 0 12px 30px rgba(0,0,0,0.10);
}

.course h2 {
    color: #1565c0;
    margin-top: 0;
    font-size: 23px;
}

.course-description {
    color: #607d8b;
    line-height: 1.8;
}


/* =========================
   شارة التسجيل
========================= */

.enrolled {
    display: inline-block;
    background: #e8f5e9;
    color: #2e7d32;
    padding: 10px 16px;
    border-radius: 30px;
    margin-top: 12px;
    font-weight: bold;
}


/* =========================
   أزرار
========================= */

button,
a {
    font-family: inherit;
}

.enroll-button,
.pdf-button,
.complete-button,
.certificate-button {

    display: inline-block;

    color: white;

    border: none;

    padding: 11px 18px;

    border-radius: 10px;

    text-decoration: none;

    margin-top: 12px;

    cursor: pointer;

    font-size: 15px;

    transition: 0.2s;
}

.enroll-button:hover,
.pdf-button:hover,
.complete-button:hover,
.certificate-button:hover {

    transform: translateY(-2px);

    opacity: 0.92;
}

.enroll-button {
    background: linear-gradient(135deg,#2e7d32,#43a047);
}

.pdf-button {
    background: linear-gradient(135deg,#1565c0,#1e88e5);
}

.complete-button {
    background: linear-gradient(135deg,#00897b,#26a69a);
    margin-right: 8px;
}

.certificate-button {
    background: linear-gradient(135deg,#6a1b9a,#8e24aa);
}


/* =========================
   الدرس
========================= */

.lesson {

    background: #f8fafc;

    padding: 20px;

    margin-top: 16px;

    border-radius: 15px;

    border-right: 5px solid #1976d2;

    box-shadow: 0 3px 10px rgba(0,0,0,0.04);
}

.lesson h3 {

    margin-top: 0;

    color: #263238;

    font-size: 19px;
}

.lesson p {

    line-height: 1.9;

    color: #546e7a;

    white-space: pre-line;
}


/* =========================
   زر الدرس المكتمل
========================= */

.completed {

    background: #78909c !important;

    cursor: default !important;

    opacity: 0.85;
}


/* =========================
   التقدم
========================= */

.progress-area {

    margin-top: 22px;

    background: #f8fafc;

    padding: 17px;

    border-radius: 15px;
}

.progress-text {

    font-weight: bold;

    margin-bottom: 10px;

    color: #37474f;
}

.progress {

    background: #e0e0e0;

    border-radius: 20px;

    height: 16px;

    overflow: hidden;
}

.progress-bar {

    background: linear-gradient(
        90deg,
        #2e7d32,
        #66bb6a
    );

    height: 100%;

    width: 0%;

    border-radius: 20px;

    transition: width 0.5s ease;
}


/* =========================
   اكتملت الدورة
========================= */

.finished {

    background: linear-gradient(
        135deg,
        #fff8e1,
        #fff3cd
    );

    color: #795548;

    padding: 16px;

    border-radius: 14px;

    margin-top: 18px;

    font-weight: bold;

    border-right: 5px solid #ffb300;
}


/* =========================
   عنوان الشهادات
========================= */

.certificates-title {

    background: linear-gradient(
        135deg,
        #6a1b9a,
        #8e24aa
    );

    color: white;

    padding: 25px;

    border-radius: 20px;

    margin-top: 35px;

    margin-bottom: 20px;

    box-shadow: 0 8px 25px rgba(106,27,154,0.2);
}

.certificates-title h2 {
    margin: 0 0 8px 0;
}


/* =========================
   بطاقة الشهادة
========================= */

.certificate-card {

    background: white;

    padding: 22px;

    border-radius: 18px;

    margin-bottom: 18px;

    border: 1px solid #eee;

    box-shadow: 0 6px 20px rgba(0,0,0,0.06);
}

.certificate-card h3 {

    color: #6a1b9a;

    margin-top: 0;
}


/* =========================
   فاصل
========================= */

.section-title {

    display: flex;

    align-items: center;

    gap: 10px;

    margin: 30px 0 15px;

    font-size: 22px;

    color: #263238;
}


/* =========================
   قالب الشهادة
========================= */

#certificateTemplate {

    position: absolute;

    left: -10000px;

    top: 0;

    width: 1123px;

    height: 794px;

    background: white;

    padding: 50px;

    box-sizing: border-box;

    text-align: center;

    font-family: Arial, sans-serif;

    direction: rtl;
}

.certificate-border {

    width: 100%;

    height: 100%;

    border: 8px double #1565c0;

    box-sizing: border-box;

    padding: 45px;
}

.certificate-title {

    font-size: 42px;

    font-weight: bold;

    color: #1565c0;

    margin: 20px 0;
}

.certificate-subtitle {

    font-size: 24px;

    margin: 15px 0;
}

.certificate-name {

    font-size: 38px;

    font-weight: bold;

    margin: 25px 0;
}

.certificate-course {

    font-size: 28px;

    font-weight: bold;

    color: #333;

    margin: 20px 0;
}

.certificate-number {

    font-size: 18px;

    margin-top: 25px;
}

#qrCode {
    margin-top: 15px;
}


/* =========================
   الهاتف
========================= */

@media (max-width: 700px) {

    header {
        padding: 25px 15px;
    }

    header h1 {
        font-size: 25px;
    }

    .logo {
        font-size: 42px;
    }

    .container {
        margin-top: 20px;
        padding: 0 12px;
    }

    .course {
        padding: 18px;
        border-radius: 16px;
    }

    .course h2 {
        font-size: 20px;
    }

    .lesson {
        padding: 16px;
    }

    .enroll-button,
    .pdf-button,
    .complete-button,
    .certificate-button {
        width: 100%;
        text-align: center;
        margin-right: 0;
    }

}


/* =========================
   شريط سفلي
========================= */

footer {

    text-align: center;

    padding: 25px;

    margin-top: 40px;

    color: #78909c;

    font-size: 14px;
}

</style>

</head>


<body>


<header>

<div class="logo">🎓</div>

<h1>منصة التكوين المستمر</h1>

<p>
التكوين • التعلم • تطوير المهارات
</p>

</header>


<div class="container">

<div id="message">
⏳ جاري تحميل الدورات...
</div>

<div id="coursesList"></div>

<div id="certificateArea"></div>

</div>


<footer>

منصة التكوين المستمر © 2026

</footer>


<!-- Supabase -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="supabase-config.js"></script>


<!-- PDF -->

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>


<!-- قالب الشهادة -->

<div id="certificateTemplate">

<div class="certificate-border">

<div style="font-size:22px;font-weight:bold;">
الجمهورية الجزائرية الديمقراطية الشعبية
</div>

<div style="font-size:20px;margin-top:10px;">
وزارة الصحة
</div>

<div style="font-size:19px;margin-top:8px;">
المؤسسة العمومية الاستشفائية بأولف
</div>

<div class="certificate-title">
شهادة إتمام تكوين
</div>

<div class="certificate-subtitle">
تشهد المؤسسة بأن المتربص:
</div>

<div id="certificateTraineeName"
     class="certificate-name">
</div>

<div class="certificate-subtitle">
قد أتم بنجاح التكوين في:
</div>

<div id="certificateCourseName"
     class="certificate-course">
</div>

<div id="certificateDate"
     style="font-size:20px;margin-top:20px;">
</div>

<div id="certificateNumber"
     class="certificate-number">
</div>

<div id="qrCode"></div>

</div>

</div>


<script>

let currentUser = null;


/* =========================
   المستخدم
========================= */

async function getCurrentUser() {

    const { data, error } =
        await supabaseClient.auth.getUser();

    if (error || !data.user) {

        console.error(error);

        return null;
    }

    return data.user;
}


/* =========================
   التسجيل
========================= */

async function isEnrolled(courseId) {

    const { data, error } =
        await supabaseClient
        .from("enrollments")
        .select("id")
        .eq("trainee_id", currentUser.id)
        .eq("course_id", courseId)
        .maybeSingle();

    if (error) {

        console.error(error);

        return false;
    }

    return !!data;
}


/* =========================
   التقدم
========================= */

async function getProgress(lessonIds) {

    if (!lessonIds.length) {
        return [];
    }

    const { data, error } =
        await supabaseClient
        .from("lesson_progress")
        .select("lesson_id")
        .eq("trainee_id", currentUser.id)
        .in("lesson_id", lessonIds);

    if (error) {

        console.error(error);

        return [];
    }

    return data || [];
}


/* =========================
   إكمال الدرس
========================= */

async function completeLesson(
    lessonId,
    button,
    courseId
) {

    button.disabled = true;

    button.textContent =
        "⏳ جاري الحفظ...";


    const { error } =
        await supabaseClient
        .from("lesson_progress")
        .insert({

            trainee_id:
                currentUser.id,

            lesson_id:
                lessonId

        });


    if (error) {

        if (error.code === "23505") {

            button.textContent =
                "✅ تم إكمال الدرس";

            button.classList.add(
                "completed"
            );

        } else {

            console.error(error);

            alert(
                "حدث خطأ أثناء حفظ التقدم"
            );

            button.disabled = false;

            button.textContent =
                "☑️ تم إكمال الدرس";
        }

        return;
    }


    button.textContent =
        "✅ تم إكمال الدرس";

    button.classList.add(
        "completed"
    );


    await updateCourseProgress(
        courseId
    );

}


/* =========================
   حساب التقدم
========================= */

async function updateCourseProgress(
    courseId
) {

    const { data: lessons, error } =
        await supabaseClient
        .from("lessons")
        .select("id")
        .eq("course_id", courseId);


    if (error || !lessons) {
        return;
    }


    const lessonIds =
        lessons.map(
            lesson => lesson.id
        );


    const progress =
        await getProgress(
            lessonIds
        );


    const total =
        lessonIds.length;

    const completed =
        progress.length;


    const percentage =
        total === 0
        ? 0
        : Math.round(
            (completed / total) * 100
        );


    const bar =
        document.getElementById(
            "progress-" + courseId
        );


    const text =
        document.getElementById(
            "progress-text-" + courseId
        );


    if (bar) {

        bar.style.width =
            percentage + "%";
    }


    if (text) {

        text.textContent =
            "📊 التقدم: " +
            completed +
            " من " +
            total +
            " دروس — " +
            percentage +
            "%";
    }


    if (
        total > 0 &&
        completed === total
    ) {

        const finished =
            document.getElementById(
                "finished-" + courseId
            );


        if (finished) {

            finished.style.display =
                "block";

            finished.textContent =
                "🏆 ممتاز! لقد أكملت جميع دروس هذه الدورة بنجاح.";
        }

    }

}


/* =========================
   التسجيل في دورة
========================= */

async function enrollInCourse(
    courseId
) {

    const { error } =
        await supabaseClient
        .from("enrollments")
        .insert({

            trainee_id:
                currentUser.id,

            course_id:
                courseId

        });


    if (error) {

        if (error.code === "23505") {

            alert(
                "أنت مسجل بالفعل في هذه الدورة ✅"
            );

        } else {

            console.error(error);

            alert(
                "حدث خطأ أثناء التسجيل"
            );

        }

        return;
    }


    alert(
        "تم التسجيل في الدورة بنجاح 🎉"
    );


    await loadCourses();

}


/* =========================
   تحميل الدروس
========================= */

async function loadLessons(
    courseId,
    container
) {

    const { data: lessons, error } =
        await supabaseClient
        .from("lessons")
        .select(
            "id,title,content,pdf_url"
        )
        .eq("course_id", courseId)
        .order(
            "title",
            {
                ascending: true
            }
        );


    if (error) {

        console.error(error);

        container.innerHTML =
            "❌ تعذر تحميل الدروس";

        return;
    }


    if (!lessons || !lessons.length) {

        container.innerHTML =
            "📭 لا توجد دروس لهذه الدورة حاليًا.";

        return;
    }


    const lessonIds =
        lessons.map(
            lesson => lesson.id
        );


    const progress =
        await getProgress(
            lessonIds
        );


    const completedIds =
        progress.map(
            item => item.lesson_id
        );


    container.innerHTML = "";


    lessons.forEach(
        function(lesson) {

            const box =
                document.createElement(
                    "div"
                );

            box.className =
                "lesson";


            const title =
                document.createElement(
                    "h3"
                );

            title.textContent =
                "📖 " +
                lesson.title;


            box.appendChild(title);


            if (lesson.content) {

                const content =
                    document.createElement(
                        "p"
                    );

                content.textContent =
                    lesson.content;

                box.appendChild(content);

            }


            if (lesson.pdf_url) {

                const link =
                    document.createElement(
                        "a"
                    );

                link.href =
                    lesson.pdf_url;

                link.target =
                    "_blank";

                link.rel =
                    "noopener noreferrer";

                link.className =
                    "pdf-button";

                link.textContent =
                    "📄 فتح ملف PDF";

                box.appendChild(link);

            }


            const completeButton =
                document.createElement(
                    "button"
                );


            completeButton.className =
                "complete-button";


            if (
                completedIds.includes(
                    lesson.id
                )
            ) {

                completeButton.textContent =
                    "✅ تم إكمال الدرس";

                completeButton.classList.add(
                    "completed"
                );

                completeButton.disabled =
                    true;

            } else {

                completeButton.textContent =
                    "☑️ تم إكمال الدرس";

                completeButton.onclick =
                    function() {

                        completeLesson(
                            lesson.id,
                            completeButton,
                            courseId
                        );

                    };

            }


            box.appendChild(
                completeButton
            );


            container.appendChild(box);

        }
    );


    await updateCourseProgress(
        courseId
    );

}


/* =========================
   الشهادة
========================= */

async function generateCertificatePDF(
    certificate
) {

    try {

        const { data: course } =
            await supabaseClient
            .from("courses")
            .select("name,course_date")
            .eq("id", certificate.course_id)
            .maybeSingle();


        const { data: trainee } =
            await supabaseClient
            .from("trainees")
            .select("full_name")
            .eq("id", certificate.trainee_id)
            .maybeSingle();


        if (!course || !trainee) {

            alert(
                "تعذر العثور على بيانات الشهادة."
            );

            return;
        }


        document.getElementById(
            "certificateTraineeName"
        ).textContent =
            trainee.full_name || "المتربص";


        document.getElementById(
            "certificateCourseName"
        ).textContent =
            course.name || "الدورة التكوينية";


        document.getElementById(
            "certificateDate"
        ).textContent =
            "تاريخ الإصدار: " +
            certificate.issue_date;


        document.getElementById(
            "certificateNumber"
        ).textContent =
            "رقم الشهادة: " +
            certificate.certificate_number;


        const qr =
            document.getElementById(
                "qrCode"
            );


        qr.innerHTML = "";


        const verificationText =
            window.location.origin +
            "/verify.html?certificate=" +
            encodeURIComponent(
                certificate.certificate_number
            );


        new QRCode(
            qr,
            {
                text:
                    verificationText,

                width:
                    110,

                height:
                    110
            }
        );


        await new Promise(
            resolve =>
                setTimeout(
                    resolve,
                    500
                )
        );


        const canvas =
            await html2canvas(
                document.getElementById(
                    "certificateTemplate"
                ),
                {
                    scale: 2,

                    backgroundColor:
                        "#ffffff",

                    useCORS: true
                }
            );


        const image =
            canvas.toDataURL(
                "image/jpeg",
                0.95
            );


        const { jsPDF } =
            window.jspdf;


        const pdf =
            new jsPDF({
                orientation:
                    "landscape",

                unit:
                    "mm",

                format:
                    "a4"
            });


        pdf.addImage(
            image,
            "JPEG",
            0,
            0,
            297,
            210
        );


        pdf.save(
            certificate.certificate_number +
            ".pdf"
        );


        alert(
            "تم إنشاء الشهادة وتحميلها بنجاح ✅"
        );

    }

    catch (error) {

        console.error(error);

        alert(
            "حدث خطأ أثناء إنشاء الشهادة."
        );

    }

}


/* =========================
   تحميل الشهادات
========================= */

async function loadMyCertificates() {

    const area =
        document.getElementById(
            "certificateArea"
        );


    const { data, error } =
        await supabaseClient
        .from("certificates")
        .select(
            "id,course_id,certificate_number,issue_date,pdf_url,trainee_id"
        )
        .eq(
            "trainee_id",
            currentUser.id
        )
        .order(
            "issue_date",
            {
                ascending: false
            }
        );


    if (error) {

        console.error(error);

        return;
    }


    area.innerHTML = "";


    if (!data || !data.length) {
        return;
    }


    const title =
        document.createElement(
            "div"
        );

    title.className =
        "certificates-title";

    title.innerHTML = `
        <h2>🏆 شهاداتي</h2>
        <p>هنا تجد الشهادات التي حصلت عليها.</p>
    `;

    area.appendChild(title);


    for (
        const certificate of data
    ) {

        const box =
            document.createElement(
                "div"
            );

        box.className =
            "certificate-card";


        let courseName =
            "الدورة التكوينية";


        const { data: course } =
            await supabaseClient
            .from("courses")
            .select("name")
            .eq(
                "id",
                certificate.course_id
            )
            .maybeSingle();


        if (course) {
            courseName =
                course.name;
        }


        box.innerHTML = `
            <h3>🏆 شهادة إتمام التكوين</h3>

            <p>
                <strong>📚 الدورة:</strong>
                ${courseName}
            </p>

            <p>
                <strong>🔢 رقم الشهادة:</strong>
                ${certificate.certificate_number}
            </p>

            <p>
                <strong>📅 تاريخ الإصدار:</strong>
                ${certificate.issue_date}
            </p>
        `;


        if (certificate.pdf_url) {

            const link =
                document.createElement(
                    "a"
                );

            link.href =
                certificate.pdf_url;

            link.target =
                "_blank";

            link.rel =
                "noopener noreferrer";

            link.className =
                "pdf-button";

            link.textContent =
                "📄 عرض الشهادة";

            box.appendChild(link);

        } else {

            const button =
                document.createElement(
                    "button"
                );

            button.className =
                "certificate-button";

            button.textContent =
                "🎓 إنشاء وتحميل الشهادة";

            button.onclick =
                function() {

                    generateCertificatePDF(
                        certificate
                    );

                };

            box.appendChild(button);

        }


        area.appendChild(box);

    }

}


/* =========================
   تحميل الدورات
========================= */

async function loadCourses() {

    const message =
        document.getElementById(
            "message"
        );


    const list =
        document.getElementById(
            "coursesList"
        );


    message.textContent =
        "⏳ جاري تحميل الدورات...";


    list.innerHTML = "";


    currentUser =
        await getCurrentUser();


    if (!currentUser) {

        message.textContent =
            "🔐 يجب تسجيل الدخول أولًا.";

        return;
    }


    const { data: courses, error } =
        await supabaseClient
        .from("courses")
        .select(
            "id,name,description"
        )
        .order(
            "name",
            {
                ascending: true
            }
        );


    if (error) {

        console.error(error);

        message.textContent =
            "❌ حدث خطأ أثناء تحميل الدورات.";

        return;
    }


    if (!courses || !courses.length) {

        message.textContent =
            "📭 لا توجد دورات حاليًا.";

        return;
    }


    message.textContent =
        "📚 الدورات التكوينية المتاحة";


    for (
        const course of courses
    ) {

        const box =
            document.createElement(
                "div"
            );

        box.className =
            "course";


        const title =
            document.createElement(
                "h2"
            );

        title.textContent =
            "📚 " +
            course.name;

        box.appendChild(title);


        const description =
            document.createElement(
                "p"
            );

        description.className =
            "course-description";

        description.textContent =
            course.description ||
            "لا يوجد وصف للدورة.";

        box.appendChild(
            description
        );


        const enrolled =
            await isEnrolled(
                course.id
            );


        if (enrolled) {

            const badge =
                document.createElement(
                    "div"
                );

            badge.className =
                "enrolled";

            badge.textContent =
                "✅ أنت مسجل في هذه الدورة";

            box.appendChild(
                badge
            );

        } else {

            const button =
                document.createElement(
                    "button"
                );

            button.className =
                "enroll-button";

            button.textContent =
                "📝 التسجيل في الدورة";

            button.onclick =
                function() {

                    enrollInCourse(
                        course.id
                    );

                };

            box.appendChild(
                button
            );

        }


        /* التقدم */

        const progressArea =
            document.createElement(
                "div"
            );

        progressArea.className =
            "progress-area";


        const progressText =
            document.createElement(
                "div"
            );

        progressText.className =
            "progress-text";

        progressText.id =
            "progress-text-" +
            course.id;

        progressText.textContent =
            "📊 جاري حساب التقدم...";


        progressArea.appendChild(
            progressText
        );


        const progress =
            document.createElement(
                "div"
            );

        progress.className =
            "progress";


        const bar =
            document.createElement(
                "div"
            );

        bar.className =
            "progress-bar";

        bar.id =
            "progress-" +
            course.id;


        progress.appendChild(bar);

        progressArea.appendChild(
            progress
        );

        box.appendChild(
            progressArea
        );


        /* اكتمال الدورة */

        const finished =
            document.createElement(
                "div"
            );

        finished.id =
            "finished-" +
            course.id;

        finished.className =
            "finished";

        finished.style.display =
            "none";

        box.appendChild(
            finished
        );


        /* عنوان الدروس */

        const lessonTitle =
            document.createElement(
                "div"
            );

        lessonTitle.className =
            "section-title";

        lessonTitle.textContent =
            "📖 دروس الدورة";

        box.appendChild(
            lessonTitle
        );


        const lessonsBox =
            document.createElement(
                "div"
            );

        lessonsBox.textContent =
            "⏳ جاري تحميل الدروس...";

        box.appendChild(
            lessonsBox
        );


        list.appendChild(box);


        await loadLessons(
            course.id,
            lessonsBox
        );

    }


    await loadMyCertificates();

}


/* =========================
   تشغيل
========================= */

loadCourses();

</script>
